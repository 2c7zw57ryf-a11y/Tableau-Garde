D.locks = D.locks||{}; D.lastGen = D.lastGen||null;

// ---- calendrier des trimestres
function trimestreDe(dAny){
  const m=monday(dAny); const y=m.getFullYear();
  const sep1=monday(new Date(y,8,1)), xmas=monday(new Date(y,11,25)), ny=monday(new Date(y,0,1)), avr30=monday(new Date(y,3,30));
  if(m>=sep1 && m<xmas) return {id:'automne-'+y, nom:'Automne '+y};
  if(m>=xmas) return {id:'fetes-'+y, nom:'Fêtes '+y+'-'+(y+1)};
  if(m<=ny) return {id:'fetes-'+(y-1), nom:'Fêtes '+(y-1)+'-'+y};
  if(m<=avr30) return {id:'hiver-'+y, nom:'Hiver '+y};
  return {id:'ete-'+y, nom:'Été '+y};
}
function semainesDe(trimId){ // mondays
  const [t,ys]=trimId.split('-'); const y=+ys; let a,b;
  if(t==='automne'){ a=monday(new Date(y,8,1)); b=addDays(monday(new Date(y,11,25)),-7); }
  else if(t==='fetes'){ a=monday(new Date(y,11,25)); b=monday(new Date(y+1,0,1)); }
  else if(t==='hiver'){ a=addDays(monday(new Date(y,0,1)),7); b=monday(new Date(y,3,30)); }
  else { a=addDays(monday(new Date(y,3,30)),7); b=addDays(monday(new Date(y,8,1)),-7); }
  const out=[]; for(let d=a; d<=b; d=addDays(d,7)) out.push(key(d)); return out;
}
function trimPrecedent(trimId){ const [t,ys]=trimId.split('-'); const y=+ys; if(t==='automne') return 'ete-'+y; if(t==='hiver') return 'automne-'+(y-1); if(t==='ete') return 'hiver-'+y; return null; }

// ---- RNG déterministe
function rng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return (s>>>0)/4294967296; }; }

// ---- compteurs d'équité sur un ensemble de gardes {k:g}
const roleW={g1:[1,0],g1j:[.5,0],g1n:[.5,0],g2:[0,1]};
function compteurs(gardes, mondays, ids){
  const c={}; ids.forEach(id=>c[id]={g1:0,j:0,n:0,g2:0,fds:0,ven:0,fer:0,f24:0,fj:0,fn:0,fg2:0,fch:0,dow:[0,0,0,0,0,0,0],fdsMois:{},fdsDates:[]});
  const inW=new Set(mondays);
  for(const k in gardes){ const g=gardes[k]; if(!g) continue; const d=parse(k); if(!inW.has(key(monday(d)))) continue;
    for(const r of ['g1','g1j','g1n','g2']){ const id=g[r]; if(!id||!c[id]) continue; c[id].g1+=roleW[r][0]; c[id].g2+=roleW[r][1]; if(r==='g1'){c[id].j++;c[id].n++;} if(r==='g1j')c[id].j++; if(r==='g1n')c[id].n++; if(FERIES.has(k)) c[id].fer++;
      if(d.getDay()===6||d.getDay()===0){ if(r==='g1'){c[id].f24++;c[id].fch+=1;} if(r==='g1j'){c[id].fj++;c[id].fch+=.5;} if(r==='g1n'){c[id].fn++;c[id].fch+=.5;} if(r==='g2'){c[id].fg2++;c[id].fch+=1;} } c[id].dow[d.getDay()]++; if(d.getDay()===5) c[id].ven++; } }
  // FDS : par week-end (ven-sam-dim), un membre compte 1 s'il a un rôle sam ou dim (le vendredi seul = garde de semaine détachée)
  mondays.forEach(mk=>{ const fri=addDays(parse(mk),4); const team=new Set(); [1,2].forEach(i=>{ const g=gardes[key(addDays(fri,i))]; if(g) ['g1','g1j','g1n','g2'].forEach(r=>{ if(g[r]) team.add(g[r]); }); });
    team.forEach(id=>{ if(!c[id]) return; c[id].fds++; const mo=fri.getFullYear()+'-'+fri.getMonth(); c[id].fdsMois[mo]=(c[id].fdsMois[mo]||0)+1; c[id].fdsDates.push(key(fri)); }); });
  return c;
}
function soldesPrecedents(trimId, ids){ const p=trimPrecedent(trimId); const s={}; ids.forEach(id=>s[id]={g1:0,g2:0,ven:0});
  if(!p) return s; const c=compteurs(D.gardes, semainesDe(p), ids); const n=ids.length; if(!n) return s;
  for(const x of ['g1','g2','ven']){ const mean=ids.reduce((a,id)=>a+c[id][x],0)/n; ids.forEach(id=>{ s[id][x]=Math.max(-1,Math.min(1,c[id][x]-mean)); }); } return s; }

// ---- score global (plus petit = meilleur)
const W={g1:100,g2:100,fdsMois:30,adj:10,dow:3,jeudi:2,ven:20,g2next:1,trou:1000};
function variance(arr){ const n=arr.length; if(!n) return 0; const m=arr.reduce((a,b)=>a+b,0)/n; return arr.reduce((a,b)=>a+(b-m)*(b-m),0)/n; }
function scoreDe(gardes, ctx){
  const c=compteurs(gardes, ctx.mondays, ctx.ids); let s=0;
  s+=W.g1*variance(ctx.ids.map(id=>c[id].g1+ctx.soldes[id].g1));
  s+=W.g2*variance(ctx.ids.map(id=>c[id].g2+ctx.soldes[id].g2));
  s+=W.ven*variance(ctx.ids.map(id=>c[id].ven+ctx.soldes[id].ven));
  ctx.ids.forEach(id=>{ for(const mo in c[id].fdsMois) if(c[id].fdsMois[mo]>1) s+=W.fdsMois*(c[id].fdsMois[mo]-1); s+=W.dow*variance(c[id].dow.slice(1,6)); });
  // adjacence : garde lun-jeu la semaine de sa FDS ou la semaine suivante
  const fdsWeek={}; ctx.ids.forEach(id=>c[id].fdsDates.forEach(f=>{ const mk=key(monday(parse(f))); (fdsWeek[id]=fdsWeek[id]||new Set()).add(mk); }));
  for(const k in gardes){ const g=gardes[k]; if(!g) continue; const d=parse(k); if(d.getDay()<1||d.getDay()>4) continue; const mk=key(monday(d)); if(!ctx.weekSet.has(mk)) continue; const prev=key(addDays(parse(mk),-7));
    ['g1','g1j','g1n','g2'].forEach(r=>{ const id=g[r]; if(!id||!fdsWeek[id]) return; if(fdsWeek[id].has(mk)||fdsWeek[id].has(prev)) s+=W.adj; });
    // jeudi avant vacances : bonus si le G1 du jeudi part en vacances la semaine suivante
    if(d.getDay()===4){ const nm=key(addDays(parse(mk),7)); const id=g.g1||g.g1j; if(id && enVac(id,nm)) s-=W.jeudi; }
    // G2 puis garde le lendemain
    const gn=gardes[key(addDays(d,1))]; if(gn && g.g2 && [gn.g1,gn.g1j,gn.g1n,gn.g2].includes(g.g2)) s+=W.g2next; }
  s+=W.trou*ctx.trous.length;
  return s;
}

// ---- admissibilité
function vacOuCongeFerie(id,k){ return enVac(id,k); }
function nuitLaVeille(gardes,k,id){ const g=gardes[key(addDays(parse(k),-1))]; return !!(g && (g.g1===id||g.g1n===id)); }
function dejaCeJour(gardes,k,id){ const g=gardes[k]; return !!(g && [g.g1,g.g1j,g.g1n,g.g2].includes(id)); }
function gardeLendemain(gardes,k,id){ const g=gardes[key(addDays(parse(k),1))]; return !!(g && [g.g1,g.g1j,g.g1n,g.g2].includes(id)); }
function okRole(gardes,k,id,role){
  if(enVac(id,k)) return false; if(dejaCeJour(gardes,k,id)) return false; if(nuitLaVeille(gardes,k,id)) return false;
  const d=parse(k); const nuit=role==='g1'||role==='g1n';
  if(nuit && d.getDay()===1 && enVac(id,key(addDays(d,-1)))) return false; // retour de vacances : pas de nuit le lundi
  if(nuit && gardeLendemain(gardes,k,id)) return false;
  return true;
}

// ---- génération (une passe = un essai)
function genererEssai(ctx, seed){
  const R=rng(seed); const G=JSON.parse(JSON.stringify(ctx.base)); const trous=[]; const detaches=new Set(); const genDays=new Set();
  const ids=ctx.ids, mem=id=>M[id];
  const cnt=()=>compteurs(G, ctx.mondays, ids);
  // ---------- 1) fins de semaine
  if(ctx.etapes.fds){
    const n12=ids.filter(id=>mem(id).modeFds==='12h').length, n24=ids.length-n12;
    const ratio=n12+n24? n12/(n12+n24):0;
    let trioSoFar=0, fdsSoFar=0;
    // trios déjà présents (gelés)
    ctx.mondays.forEach(mk=>{ const sat=key(addDays(parse(mk),5)); const g=G[sat]; if(g&&!ctx.weekends.includes(mk)){ fdsSoFar++; if(g.g1j) trioSoFar++; } });
    ctx.weekends.forEach(mk=>{
      const fri=addDays(parse(mk),4), sat=addDays(fri,1), sun=addDays(fri,2); const kF=key(fri), kS=key(sat), kD=key(sun);
      const c=cnt();
      const elig=(grp)=>ids.filter(id=>{ const m=mem(id); if(m.modeFds!==grp) return false;
        if(enVac(id,kS)||enVac(id,kD)) return false; if(!m.venSep && enVac(id,kF)) return false;
        if(dejaCeJour(G,kS,id)||dejaCeJour(G,kD,id)) return false;
        // pas deux FDS consécutives (dur)
        if(c[id].fdsDates.some(f=>Math.abs((parse(f)-fri)/864e5)<=7)) return false;
        if(nuitLaVeille(G,kF,id) && !m.venSep) return false;
        return true; });
      const cost=id=>{ const m=mem(id); const mo=fri.getFullYear()+'-'+fri.getMonth(); return (c[id].fds*10) + (c[id].fdsMois[mo]?6:0) + (c[id].g1+ctx.soldes[id].g1)*2 + R()*0.5; };
      const wantTrio = fdsSoFar===0 ? (ratio>=0.5) : ((trioSoFar+1)/(fdsSoFar+1) <= ratio+1e-9);
      let team=null, trio=false;
      const e12=elig('12h').sort((a,b)=>cost(a)-cost(b)), e24=elig('24h').sort((a,b)=>cost(a)-cost(b));
      if(wantTrio && e12.length>=3){ team=e12.slice(0,3); trio=true; }
      else if(e24.length>=2){ team=e24.slice(0,2); }
      else if(e12.length>=3){ team=e12.slice(0,3); trio=true; }
      if(!team){ trous.push(`FDS du ${fmtLong(fri)} : aucune équipe admissible`); return; }
      const venSep=team.some(id=>mem(id).venSep);
      genDays.add(kF); genDays.add(kS); genDays.add(kD);
      if(trio){ const [A,B,C]=team;
        if(venSep){ detaches.add(kF); G[kS]={g1j:A,g1n:B,g2:C}; G[kD]={g1j:C,g1n:A,g2:B}; }
        else { G[kF]={g1j:A,g1n:B,g2:C}; G[kS]={g1j:C,g1n:A,g2:B}; G[kD]={g1j:B,g1n:C,g2:A}; }
        trioSoFar++;
      } else { const [A,B]=team;
        if(venSep){ detaches.add(kF); G[kS]={g1:A,g2:B}; G[kD]={g1:B,g2:A}; }
        else { G[kF]={g1:A,g2:B}; G[kS]={g1:B,g2:A}; G[kD]={g1:A,g2:B}; }
      }
      fdsSoFar++;
    });
  }
  // ---------- 2) semaine : lun-jeu + vendredis détachés (+ vendredis sans garde dans les semaines choisies)
  if(ctx.etapes.sem){
    const jours=[];
    ctx.weeks.forEach(mk=>{ for(let i=0;i<5;i++){ const d=addDays(parse(mk),i), k=key(d); if(d<=genCut()) continue; if(FERIES.has(k)) continue; if(D.locks[k]) continue;
      if(i===4){ if(!(detaches.has(k) || (!G[k] && ctx.weekends.includes(mk)) || (!G[k] && !ctx.base[k]))) continue; }
      jours.push(k); } });
    jours.sort();
    jours.forEach(k=>{
      const d=parse(k); const c=cnt(); const mk=key(monday(d)); const nextMk=key(addDays(parse(mk),7));
      const fdsOf=id=>c[id].fdsDates.some(f=>{ const w=key(monday(parse(f))); return w===mk || w===key(addDays(parse(mk),-7)); });
      const base=(id,role)=>{ const nuit=role==='g1'||role==='g1n'; let x=0;
        x+= (role==='g2' ? (c[id].g2+ctx.soldes[id].g2)*10 : (c[id].g1+ctx.soldes[id].g1)*10*(role==='g1'?1:0.5));
        if(fdsOf(id)) x+=W.adj;
        x+= c[id].dow[d.getDay()]*W.dow;
        if(d.getDay()===4 && enVac(id,nextMk) && role!=='g2') x-=W.jeudi;
        if(d.getDay()===5) x+=(c[id].ven+ctx.soldes[id].ven)*W.ven/2;
        return x+R()*0.8; };
      const pool24=ids.filter(id=>mem(id).mode==='24h' && okRole(G,k,id,'g1'));
      const pool12=ids.filter(id=>mem(id).mode==='12h');
      const poolJ=pool12.filter(id=>okRole(G,k,id,'g1j')), poolN=pool12.filter(id=>okRole(G,k,id,'g1n'));
      // 1) quel groupe reçoit le G1 du jour : celui dont la moyenne de G1 (solde compris) est la plus basse
      const moy=grp=>{ const g=ids.filter(id=>mem(id).mode===grp); return g.length? g.reduce((a,id)=>a+c[id].g1+ctx.soldes[id].g1,0)/g.length : Infinity; };
      const m24=moy('24h'), m12=moy('12h');
      const opt24=()=>{ if(!pool24.length) return null; const id=pool24.sort((a,b)=>base(a,'g1')-base(b,'g1'))[0]; return {g1:id}; };
      const opt12=()=>{ if(!(poolJ.length&&poolN.length)) return null; const J=poolJ.sort((a,b)=>base(a,'g1j')-base(b,'g1j'))[0]; const N=poolN.filter(x=>x!==J).sort((a,b)=>base(a,'g1n')-base(b,'g1n'))[0]; return N?{g1j:J,g1n:N}:null; };
      const prefer12 = m12 < m24 - 1e-9 || (Math.abs(m12-m24)<1e-9 && R()<0.5);
      const gsel = prefer12 ? (opt12()||opt24()) : (opt24()||opt12());
      if(!gsel){ trous.push(`${fmtLong(d)} : aucun G1 admissible`); return; }
      const g=gsel; G[k]=g;
      const pris=[g.g1,g.g1j,g.g1n].filter(Boolean);
      const pool2=ids.filter(id=>!pris.includes(id) && okRole(G,k,id,'g2'));
      if(!pool2.length){ trous.push(`${fmtLong(d)} : aucun G2 admissible`); delete G[k]; return; }
      g.g2=pool2.sort((a,b)=>base(a,'g2')-base(b,'g2'))[0]; genDays.add(k);
    });
  }
  // ---------- 3) amélioration locale (descente simple)
  const ctx2={...ctx, trous};
  const days=[...genDays].filter(k=>G[k]);
  const sc = (ctx.etapes.sem||ctx.etapes.fds) ? ameliorer(G, ctx2, R, days, 350, 0) : scoreDe(G,ctx2);
  return {G, score:sc, trous, detaches:[...detaches], genDays:[...genDays]};
}

// ---- validité d'un jour (après un mouvement)
// À l'intérieur d'une fin de semaine (ven→sam→dim), les séquences d'équipe enchaînent nuit puis G2 : la règle post-garde ne s'applique qu'en sortant de la FDS (lundi) et en semaine.
function jourValide(G,k){ const g=G[k]; if(!g) return true; const ids=[g.g1,g.g1j,g.g1n,g.g2].filter(Boolean); if(new Set(ids).size!==ids.length) return false;
  const d=parse(k), dow=d.getDay(); const dansFds = dow===6||dow===0; const versFds = dow===5||dow===6;
  for(const r of ['g1','g1j','g1n','g2']){ const id=g[r]; if(!id) continue; if(enVac(id,k)) return false; if(!dansFds && nuitLaVeille(G,k,id)) return false;
    const nuit=r==='g1'||r==='g1n'; if(nuit && dow===1 && enVac(id,key(addDays(d,-1)))) return false; if(nuit && !versFds && gardeLendemain(G,k,id)) return false; } return true; }
function fdsProche(G,id,fri){ // une autre FDS (sam/dim) à ±7 jours
  for(const off of [-7,7]){ const s=key(addDays(fri,off+1)), d=key(addDays(fri,off+2)); for(const k of [s,d]){ const g=G[k]; if(g && [g.g1,g.g1j,g.g1n,g.g2].includes(id)) return true; } } return false; }
// ---- amélioration : moves aléatoires, acceptation si meilleur ou (recuit) avec probabilité exp(-Δ/T)
function ameliorer(G, ctx2, R, days, moves, T){
  const ids=ctx2.ids, mem=id=>M[id]; let sc=scoreDe(G,ctx2);
  const roleKeys=['g1','g1j','g1n','g2'];
  const wkends=(ctx2.weekends||[]).filter(mk=>G[key(addDays(parse(mk),5))]);
  const accept=ns=>{ if(ns<sc){ sc=ns; return true; } if(T>0 && R()<Math.exp(-(ns-sc)/T)){ sc=ns; return true; } return false; };
  for(let it=0; it<moves && days.length>1; it++){
    const u=R();
    if(u<0.12 && wkends.length>1){ // échange de deux équipes de FDS du même type
      const a=wkends[Math.floor(R()*wkends.length)], b=wkends[Math.floor(R()*wkends.length)]; if(a===b) continue;
      const fa=addDays(parse(a),4), fb=addDays(parse(b),4); const ka=[0,1,2].map(i=>key(addDays(fa,i))), kb=[0,1,2].map(i=>key(addDays(fb,i)));
      const ta=G[ka[1]], tb=G[kb[1]]; if(!!ta.g1!==!!tb.g1) continue; // paire vs trio
      const teamA=[...new Set([ka[1],ka[2]].flatMap(k=>roleKeys.map(r=>G[k]&&G[k][r]).filter(Boolean)))], teamB=[...new Set([kb[1],kb[2]].flatMap(k=>roleKeys.map(r=>G[k]&&G[k][r]).filter(Boolean)))];
      if(teamA.length!==teamB.length) continue; const map={}; teamA.forEach((id,i)=>{ map[id]=teamB[i]; map[teamB[i]]=id; });
      const saved={}; [...ka,...kb].forEach(k=>{ saved[k]=G[k]?{...G[k]}:null; });
      let ok=true; [...ka,...kb].forEach(k=>{ const g=G[k]; if(!g) return; const isFri=k===ka[0]||k===kb[0]; const teamDay=roleKeys.some(r=>g[r] && (teamA.includes(g[r])||teamB.includes(g[r]))); if(isFri && !teamDay) return; const ng={}; roleKeys.forEach(r=>{ if(g[r]) ng[r]=map[g[r]]||g[r]; }); G[k]=ng; });
      [...ka,...kb].forEach(k=>{ if(!jourValide(G,k)) ok=false; });
      teamA.forEach(id=>{ if(fdsProche(G,map[id]===id?id:id,fb)) ok=false; }); teamB.forEach(id=>{ if(fdsProche(G,id,fa)) ok=false; });
      if(ok){ const ns=scoreDe(G,ctx2); if(!accept(ns)) ok=false; }
      if(!ok) for(const k in saved){ if(saved[k]) G[k]=saved[k]; else delete G[k]; }
      continue;
    }
    const k1=days[Math.floor(R()*days.length)], g1=G[k1]; if(!g1) continue;
    const rks=roleKeys.filter(r=>g1[r]); const r=rks[Math.floor(R()*rks.length)]; const id1=g1[r];
    if(u<0.5){ // échange de rôle entre deux jours générés
      const k2=days[Math.floor(R()*days.length)]; if(k2===k1) continue; const g2=G[k2]; if(!g2||!g2[r]) continue; const id2=g2[r]; if(id1===id2) continue;
      if(isFds(parse(k1))||isFds(parse(k2))) continue;
      const s1={...g1}, s2={...g2}; g1[r]=id2; g2[r]=id1;
      if(!jourValide(G,k1)||!jourValide(G,k2)){ G[k1]=s1; G[k2]=s2; continue; }
      const ns=scoreDe(G,ctx2); if(!accept(ns)){ G[k1]=s1; G[k2]=s2; }
    } else if(u<0.62 && !isFds(parse(k1)) && (g1.g1||(g1.g1j&&g1.g1n))){ // conversion 24 h ↔ J/N
      const save={...g1};
      if(g1.g1){ delete g1.g1; const pj=ids.filter(id=>mem(id).mode==='12h'&&okRole(G,k1,id,'g1j')); const pn=ids.filter(id=>mem(id).mode==='12h'&&okRole(G,k1,id,'g1n'));
        const J=pj[Math.floor(R()*pj.length)], N=pn.filter(x=>x!==J)[Math.floor(R()*Math.max(1,pn.length-1))]; if(!J||!N){ G[k1]=save; continue; } g1.g1j=J; g1.g1n=N; }
      else { delete g1.g1j; delete g1.g1n; const p=ids.filter(id=>mem(id).mode==='24h'&&okRole(G,k1,id,'g1')); const id=p[Math.floor(R()*p.length)]; if(!id){ G[k1]=save; continue; } g1.g1=id; }
      if(!jourValide(G,k1)){ G[k1]=save; continue; }
      const ns=scoreDe(G,ctx2); if(!accept(ns)) G[k1]=save;
    } else { // remplacement par un autre membre admissible
      const d1=parse(k1); if(isFds(d1) && r!=='g2') continue;
      if(isFds(d1) && d1.getDay()!==6 && R()<0.7) continue;
      const cand=ids.filter(id=>id!==id1 && (!isFds(d1) || mem(id).modeFds==='12h' || mem(id).mode==='12h' || R()<0.3));
      const id2=cand[Math.floor(R()*cand.length)]; if(!id2) continue;
      if(isFds(d1) && mem(id1).modeFds==='24h' && mem(id2).modeFds!=='12h') continue;
      const save={...g1}; g1[r]=id2; if(!jourValide(G,k1)){ G[k1]=save; continue; }
      const ns=scoreDe(G,ctx2); if(!accept(ns)) G[k1]=save;
    }
  }
  return sc;
}

// ---- ordre de choix de salle (déterministe)
function genererSalles(G, ctx){
  const ids=ctx.ids; const passes={}; ids.forEach(id=>passes[id]={b1:0,b2:0,lastB1:'',lastPos:0});
  const b1Max=D.blocs[0]||7;
  // historique du trimestre (attribution initiale = ce qui est dans choix)
  const sem=ctx.mondays; const inW=new Set(sem);
  const jours=Object.keys(D.choix).filter(k=>inW.has(key(monday(parse(k))))).sort();
  jours.forEach(k=>{ const c=D.choix[k]; c.ordre.forEach((id,i)=>{ if(i<2||!passes[id]) return; const pos=i+1; if(pos<=b1Max){ passes[id].b1++; passes[id].lastB1=k; } else passes[id].b2++; passes[id].lastPos=pos; }); });
  const out={}; const days=[];
  ctx.weeks.forEach(mk=>{ for(let i=0;i<5;i++){ const d=addDays(parse(mk),i), k=key(d); if(d<=genCut()||FERIES.has(k)||D.locks[k]) continue; if(!G[k]) continue; days.push(k); } });
  days.sort().forEach(k=>{
    const g=G[k]; const post=[]; const gp=G[key(addDays(parse(k),-1))]; if(gp) [gp.g1,gp.g1n].filter(Boolean).forEach(x=>post.push(x));
    const top=[g.g1||g.g1j, g.g2];
    let rest=ids.filter(id=>!top.includes(id) && id!==g.g1n && !post.includes(id) && !enVac(id,k) && M[id].actif);
    rest.sort((a,b)=> (passes[a].b1-passes[b].b1) || (passes[a].lastB1<passes[b].lastB1?-1:passes[a].lastB1>passes[b].lastB1?1:0) || (passes[a].lastPos-passes[b].lastPos) );
    const ordre=[...top,...rest];
    ordre.forEach((id,i)=>{ if(i<2) return; const pos=i+1; if(pos<=b1Max){ passes[id].b1++; passes[id].lastB1=k; } else passes[id].b2++; passes[id].lastPos=pos; });
    const prev=D.choix[k]; out[k]={ordre, nuit:g.g1n||null, postGarde:post.sort(), absents:ids.filter(id=>enVac(id,k)), ...(prev&&prev.hb!==undefined?{hb:prev.hb}:{})};
  });
  return out;
}

// ---- interface
const genCut=()=> gen.passe ? new Date(1970,0,1) : TODAY;

function gestGenerateur(box){

  const gn=document.getElementById('gaNext'); if(gn) gn.onclick=()=>{ gen.pending.cursor=addDays(gen.pending.cursor,7); renderGest(); };
}
function lancerGeneration(){
  if(!gen.weeks.size) return toast('Cochez au moins une semaine');
  const weeks=[...gen.weeks].sort(); const mondays=semainesDe(gen.trim); const ids=actifs().map(m=>m.id);
  // base = horaire actuel, vidé des jours à regénérer (à venir, non verrouillés, non fériés)
  const base={}; for(const k in D.gardes) base[k]=JSON.parse(JSON.stringify(D.gardes[k]));
  const weekends=[]; weeks.forEach(mk=>{ const fri=addDays(parse(mk),4); if(fri<=genCut()) return; if(!gen.etapes.fds) return; if([0,1,2].some(i=>D.locks[key(addDays(fri,i))])) return; weekends.push(mk); [0,1,2].forEach(i=>{ const k=key(addDays(fri,i)); if(!FERIES.has(k)) delete base[k]; }); });

function preparerGeneration(best, ctx, info){

  const c=compteurs(G, ctx.mondays, ctx.ids);

      const out=[]; D.vacances.forEach(v=>{ if(v.membre!==m || v.motif || v.fin<a || v.debut>f){ out.push(v); return; } if(v.debut<a) out.push({...v,fin:key(addDays(parse(a),-1))}); if(v.fin>f) out.push({...v,debut:key(addDays(parse(f),1))}); });
      D.vacances=out; Store.save(); Store.log(`Vacances ${ini(m)} retirées : semaine du ${mk}`); renderGest(); }); });
  box.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{ const [mk,d]=b.dataset.cap.split('|'); const cur=D.capacites[mk]!==undefined?D.capacites[mk]:2; D.capacites[mk]=Math.max(0,cur+ +d); Store.save(); renderGest(); });
}

// ---- navigation
function render(){
  document.getElementById('vSem').setAttribute('aria-pressed', view==='week');
  document.getElementById('vMois').setAttribute('aria-pressed', view==='month');
  document.getElementById('vMoi').setAttribute('aria-pressed', view==='moi');
  document.getElementById('week').hidden = view!=='week';
  document.getElementById('monthWrap').hidden = view!=='month';
  document.getElementById('moiWrap').hidden = view!=='moi';
  document.getElementById('vEch').setAttribute('aria-pressed', view==='ech');
  document.getElementById('echWrap').hidden = view!=='ech';
  document.getElementById('vGest').hidden = !admin;
  document.getElementById('vGest').setAttribute('aria-pressed', view==='gest');
  document.getElementById('gestWrap').hidden = view!=='gest';
  document.getElementById('prev').hidden = document.getElementById('next').hidden = document.getElementById('today').hidden = (view==='moi'||view==='gest'||view==='ech');
  if(view==='week') renderWeek(); else if(view==='month') renderMonth(); else if(view==='gest') renderGest(); else if(view==='ech') renderEch(); else renderMoi();
  updBadge();
}
function setView(v){ view=v; try{localStorage.setItem('tg.view',v);}catch(e){} render(); }
document.getElementById('vSem').onclick=()=>setView('week');
document.getElementById('vMois').onclick=()=>setView('month');
document.getElementById('vMoi').onclick=()=>setView('moi');
document.getElementById('vGest').onclick=()=>setView('gest');
document.getElementById('vEch').onclick=()=>{ ech.mode='list'; setView('ech'); };
document.getElementById('prev').onclick=()=>{ if(view==='week') cursor=addDays(cursor,-7); else { cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1); selDay='';} render(); };
document.getElementById('next').onclick=()=>{ if(view==='week') cursor=addDays(cursor,7); else { cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1); selDay='';} render(); };
document.getElementById('today').onclick=()=>{ cursor=new Date(TODAY); selDay=key(TODAY); render(); };

// ---- impression
const PMONDAYS=(()=>{const a=[];let d=monday(parse(D.periode.debut));const fin=parse(D.periode.fin);while(d<=fin){a.push(key(d));d=addDays(d,7);}return a;})();
const dlg=document.getElementById('printDlg'), pWeeks=document.getElementById('pWeeks');
let SEL=new Set();
function wkLabel(k){const a=parse(k),b=addDays(a,6);return a.getDate()+' '+MOIS[a.getMonth()].slice(0,4)+'. – '+b.getDate()+' '+MOIS[b.getMonth()].slice(0,4)+'.';}
const YEARS=[...new Set(PMONDAYS.map(k=>k.slice(0,4)))];
let pYear = YEARS.includes(String(TODAY.getFullYear())) ? String(TODAY.getFullYear()) : YEARS[YEARS.length-1];
let showPast=false;
function renderYears(){
  document.getElementById('pYears').innerHTML = YEARS.length>1 ? `<span class="lbl">Année</span>`+YEARS.map(y=>`<button aria-pressed="${y===pYear}" data-y="${y}">${y}</button>`).join('') : '';
  document.querySelectorAll('#pYears button').forEach(b=>b.onclick=()=>{pYear=b.dataset.y; showPast=true; renderYears(); renderWeeks();});
}
function renderWeeks(){
  let h='',lastM='';
  const curK=key(monday(TODAY));
  const thisYear = pYear===String(TODAY.getFullYear());
  const monthStart = key(monday(new Date(TODAY.getFullYear(),TODAY.getMonth(),1)));
  const weeks=PMONDAYS.filter(k=>k.slice(0,4)===pYear);
  const past=thisYear && !showPast ? weeks.filter(k=>k<monthStart) : [];
  if(past.length) h+=`<button class="past" id="showPast">Afficher les ${past.length} semaines précédentes de ${pYear}</button>`;
  for(const k of weeks){
    if(past.includes(k)) continue;
    const d=parse(k); const mo=MOIS[d.getMonth()]+' '+d.getFullYear();
    if(mo!==lastM){h+=`<div class="mo">${mo[0].toUpperCase()+mo.slice(1)}</div>`;lastM=mo;}
    h+=`<button class="wk${k===curK?' cur':''}" data-k="${k}" aria-pressed="${SEL.has(k)}"><span class="box"></span>${wkLabel(k)}${k===curK?' (en cours)':''}</button>`;
  }
  pWeeks.innerHTML=h;
  const sp=document.getElementById('showPast'); if(sp) sp.onclick=()=>{showPast=true; renderWeeks();};
  pWeeks.querySelectorAll('.wk').forEach(b=>b.onclick=()=>{const k=b.dataset.k; SEL.has(k)?SEL.delete(k):SEL.add(k); b.setAttribute('aria-pressed',SEL.has(k)); updCount();});
  updCount();
}
function updCount(){ const n=SEL.size; document.getElementById('pCount').textContent = n===0?'Aucune semaine sélectionnée':(n===1?'1 semaine sélectionnée':n+' semaines sélectionnées'); document.getElementById('pGo').disabled=n===0; }
function preset(p){
  SEL=new Set();
  if(p==='week') SEL.add(key(monday(TODAY)));
  else if(p==='month'){ const a=key(monday(new Date(TODAY.getFullYear(),TODAY.getMonth(),1))), b=key(monday(new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0))); PMONDAYS.forEach(k=>{ if(k>=a&&k<=b) SEL.add(k); }); }
  else if(p==='all') PMONDAYS.forEach(k=>SEL.add(k));
  if(p!=='all'){ pYear = YEARS.includes(String(TODAY.getFullYear())) ? String(TODAY.getFullYear()) : YEARS[YEARS.length-1]; showPast=false; }
  renderYears(); renderWeeks();
  const cur=pWeeks.querySelector('.wk.cur'); if(cur) cur.scrollIntoView({block:'center'});
}
document.querySelectorAll('.presets button').forEach(b=>b.onclick=()=>preset(b.dataset.p));
document.getElementById('btnPrint').onclick=()=>{ preset('week'); dlg.hidden=false; };
document.getElementById('pCancel').onclick=()=>dlg.hidden=true;
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.hidden=true; });
function g1Txt(g,d){
  if(!g) return '—';
  if(g.g1) return ini(g.g1);
  const renfort = M[g.g1n] && d.getDay()===5 && M[g.g1n].modeFds==='24h';
  return ini(g.g1j)+' (j'+(renfort?', renfort':'')+') / '+ini(g.g1n)+' (n)';
}
function salleTxt(k){
  const c=D.choix[k]; if(!c) return '';
  const o=c.ordre, b=D.blocs;
  const parts=[['1-2',o.slice(0,2)],['3-'+b[0],o.slice(2,b[0])]];
  for(let i=1;i<b.length;i++){ const lo=b[i-1]+1, hi=b[i]; parts.push([lo===hi?String(lo):lo+'-'+hi, o.slice(lo-1,hi)]); }
  const hb=hbDe(c); const nHB=Math.min(hb, Math.max(0,o.length-2));
  parts.push([b[b.length-1]+1+'+', o.slice(b[b.length-1], o.length-nHB)]);
  if(nHB>0) parts.push(['HB', o.slice(o.length-nHB)]);
  let s=parts.filter(p=>p[1].length).map(p=>`<b>${p[0]}</b> ${p[1].map(ini).join(' ')}`).join(' &nbsp;·&nbsp; ');
  const r=[]; if(c.nuit) r.push('nuit '+ini(c.nuit)); if(c.postGarde.length) r.push('post-garde '+c.postGarde.map(ini).join(' '));
  if(r.length) s+=` <span class="blk">(${r.join(', ')})</span>`;
  return s;
}
document.getElementById('pGo').onclick=()=>{
  const withSalle=document.getElementById('pSalle').checked;
  let h=`<h2>Tableau de garde — Anesthésiologie</h2>`;
  for(const mk of PMONDAYS){
    if(!SEL.has(mk)) continue;
    const mon=parse(mk), sun=addDays(mon,6);
    h+=`<div class="pw"><table><thead><tr><th colspan="${withSalle?4:3}">Semaine du ${fmtLong(mon)} au ${fmtLong(sun)} ${sun.getFullYear()}</th></tr><tr><th>Jour</th><th>G1</th><th>G2</th>${withSalle?'<th>Ordre de choix de salle</th>':''}</tr></thead><tbody>`;
    for(let i=0;i<7;i++){
      const d=addDays(mon,i), k=key(d), g=gardeDe(k);
      h+=`<tr class="${isFds(d)?'fds':''}"><td class="d">${JOURS_C[d.getDay()]} ${d.getDate()}${FERIES.has(k)?' (férié)':''}</td><td class="g">${g1Txt(g,d)}</td><td class="g">${g?ini(g.g2):'—'}</td>${withSalle?'<td>'+salleTxt(k)+'</td>':''}</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`<div class="foot">Imprimé le ${fmtLong(TODAY)} ${TODAY.getFullYear()}${D.demo?' — horaire de démonstration':''}. G1 j = jour (part à 18 h), n = nuit (arrive à 18 h). HB = hors bloc.</div>`;
  const pr=document.getElementById('print'); pr.innerHTML=h;
  dlg.hidden=true;
  setTimeout(()=>window.print(),50);
};
if(!D.demo) document.getElementById('demo').remove();
if(view==='gest' && !admin) view='week';
if(ONLINE){ render(); bootOnline(); } else render();
</script>
