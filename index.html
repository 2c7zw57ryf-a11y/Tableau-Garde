<style>

  --g1:#0f766e; --g1-soft:#d5efeb; --g1-ink:#0a5751;
  --g2:#b45309; --g2-soft:#fbe6cc; --g2-ink:#8a3f05;
  --today:#1b2430; --vac:#c9d1da; --fds:#f8fafc;

}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#151a21; --panel:#1e242d; --line:#2e3742; --ink:#e8ecf1; --muted:#97a2b0;
  --g1-soft:#123f3b; --g1-ink:#8fdcd2; --g2-soft:#4a2a0c; --g2-ink:#f5c28a;
  --today:#e8ecf1; --vac:#3a4452; --fds:#1a1f27;
}}
:root[data-theme="dark"]{
  --bg:#151a21; --panel:#1e242d; --line:#2e3742; --ink:#e8ecf1; --muted:#97a2b0;
  --g1-soft:#123f3b; --g1-ink:#8fdcd2; --g2-soft:#4a2a0c; --g2-ink:#f5c28a;
  --today:#e8ecf1; --vac:#3a4452; --fds:#1a1f27;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible,.cell:focus-visible{outline:2px solid var(--g1);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.top h1 span{color:var(--muted);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:700}
.nav{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:6px 10px;min-width:38px}
.nav .title{min-width:150px;text-align:center;font-weight:700}
.who{display:inline-flex;align-items:center;gap:8px}
.who select{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:7px 10px;max-width:220px}
.who label{color:var(--muted)}
.demo{background:var(--g2-soft);color:var(--g2-ink);padding:6px 14px;font-size:14px;text-align:center}

main{padding:14px;max-width:1500px;margin:0 auto}

/* ---------- carte de jour ---------- */
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.day.fds{background:var(--fds)}
.day.today{border-color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
.day header{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day header .dn{font-weight:700}
.day header .dn small{font-weight:400;color:var(--muted);margin-left:6px}
.day header .tag{font-size:12px;color:var(--muted)}
.day .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.role{display:grid;grid-template-columns:46px 1fr;gap:6px 10px;align-items:center}
.pill{display:inline-flex;align-items:center;justify-content:center;width:46px;height:24px;padding:0;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1;justify-self:start}
.pill.g1{background:var(--g1);color:#fff}
.pill.g2{background:var(--g2);color:#fff}
.pill.sub{background:var(--g1-soft);color:var(--g1-ink)}
.nm{font-weight:700;font-size:17px}
.nm small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.nm.me{text-decoration:underline;text-decoration-color:var(--g2);text-decoration-thickness:2px;text-underline-offset:3px}
.sep{height:1px;background:var(--line);margin:2px 0}
.salle h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:400}
.salle ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.salle li .ini{font-weight:700}
.salle li{display:flex;gap:8px;align-items:center;padding:2px 0;font-size:15px}
.salle li .n{width:22px;color:var(--muted);font-size:13px;text-align:right}
.salle li.me{font-weight:700;background:var(--g2-soft);border-radius:4px;margin:0 -6px;padding:2px 6px}
.salle li.garde .ini{color:var(--g1-ink);font-weight:700}
.salle li.blk{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.salle li.blk .n{font-size:11px}
.retrait{color:var(--muted);font-size:14px;line-height:1.5}
.retrait b{color:var(--ink);font-weight:700}
.empty{color:var(--muted);font-style:italic}

/* ---------- semaine ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:720px){.week{grid-template-columns:1fr}}

/* ---------- mois ---------- */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .hd{text-align:center;color:var(--muted);font-size:13px;padding:4px 0 6px}
.cell{border:1px solid var(--line);border-radius:var(--r-sm);min-height:82px;padding:6px 7px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;transition:transform .08s}
.cell:active{transform:scale(.97)}
.cell.fds{background:var(--fds)}
.cell.out{opacity:.35}
.cell .num{font-weight:700;font-size:14px;line-height:1}
.cell.today .num{background:var(--today);color:var(--bg);border-radius:999px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.cell.ferie .num::after{content:"●";color:var(--g2);font-size:7px;margin-left:4px;vertical-align:middle}
.cell .ini{font-size:13px;line-height:1.25;display:flex;flex-direction:column;gap:1px}
.cell .ini .l{display:flex;gap:5px;align-items:baseline}
.cell .ini .k{font-size:10px;color:var(--muted);width:12px}
.cell .ini .k.g1{color:var(--g1)} .cell .ini .k.g2{color:var(--g2)}
.cell.me-g1{background:var(--g1);border-color:var(--g1);color:#fff}
.cell.me-g1 .num,.cell.me-g1 .k{color:#fff}
.cell.me-g1.half{background:linear-gradient(135deg,var(--g1) 0 55%,var(--g1-soft) 55% 100%);color:var(--g1-ink)}
.cell.me-g1.half .num{color:#fff}
.cell.me-g2{background:var(--g2);border-color:var(--g2);color:#fff}
.cell.me-g2 .num,.cell.me-g2 .k{color:#fff}
.cell.me-vac{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--vac) 6px 8px)}
.cell.sel{box-shadow:0 0 0 2px var(--today)}
.cell.today.me-g1 .num,.cell.today.me-g2 .num{background:#fff;color:var(--ink)}
@media (max-width:720px){
  .month{gap:3px}
  .cell{min-height:56px;padding:4px 5px}
  .cell .ini{font-size:11px}
  .cell .ini .k{display:none}
}
.filters{display:flex;flex-wrap:wrap;gap:10px 18px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;font-size:15px}
.filters select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r-sm);padding:3px 6px;margin:0 4px}
.moi{display:flex;flex-direction:column;gap:6px;max-width:640px}
.moi .mo{color:var(--muted);font-size:13px;margin:10px 2px 2px}
.moi .mo:first-child{margin-top:0}
.moi .it{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:var(--bg);text-align:left;font-size:15px}
.moi .it.fds{background:var(--fds)}
.moi .it.today{border-color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
.moi .it .dt{width:110px;flex:none;font-weight:700}
.moi .it .dt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.moi .it .tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.tg.g1{background:var(--g1);color:#fff} .tg.g2{background:var(--g2);color:#fff}
.tg.post{background:var(--g1-soft);color:var(--g1-ink)} .tg.vac{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--vac) 4px 6px);color:var(--ink);border:1px solid var(--line)} .tg.pos{background:var(--g2-soft);color:var(--g2-ink)}
.moi .past{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-sm);padding:8px;font-size:14px}
.moi .hint{color:var(--muted);margin:4px 2px}
.moi #moiDetail{margin-top:8px}
.cell.me-post{background:var(--g1-soft);border-color:var(--g1-soft)}
.cell .pos{position:absolute;top:4px;right:5px;font-size:11px;font-weight:700;background:var(--g2-soft);color:var(--g2-ink);border-radius:999px;padding:1px 6px}
.cell.me-g1 .pos,.cell.me-g2 .pos{background:rgba(255,255,255,.9)}
@media (max-width:720px){ .cell .pos{font-size:10px;padding:0 4px;top:3px;right:3px} .moi .it .dt{width:90px} }
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:13px;margin:12px 2px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
#detail{margin-top:14px;max-width:560px}
#detail .day{border-color:var(--today)}
#detail .hint{color:var(--muted);font-size:14px;margin:10px 2px}

.print-btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:6px 12px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-box{background:var(--bg);color:var(--ink);border-radius:var(--r);padding:18px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlg-box h2{margin:0;font-size:18px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px}
.presets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding:2px}
.weeks .mo{font-size:13px;color:var(--muted);margin:6px 0 0}
.weeks .mo:first-child{margin-top:0}
.weeks .wk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:var(--bg);text-align:left;font-size:15px}
.weeks .wk .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:4px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
.weeks .wk[aria-pressed="true"]{background:var(--g1-soft);border-color:var(--g1)}
.weeks .wk[aria-pressed="true"] .box{background:var(--g1);border-color:var(--g1)}
.weeks .wk[aria-pressed="true"] .box::after{content:"✓"}
.weeks .wk.cur{font-weight:700}
.pcount{color:var(--muted);font-size:13px}
.yrs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.yrs button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:5px 12px}
.yrs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.yrs .lbl{color:var(--muted);font-size:13px;margin-right:4px}
.weeks .past{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:var(--r-sm);padding:6px 10px;font-size:14px;text-align:center}
.chk{display:flex;gap:8px;align-items:center}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px}
.dlg-actions button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:7px 14px}
.dlg-actions .primary{background:var(--g1);border-color:var(--g1);color:#fff;font-weight:700}
/* ---------- gestion ---------- */
.sw{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sw input{margin:0}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;color:var(--muted)}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.gnav{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.gnav button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:6px 10px;min-width:38px}
.gnav .title{font-weight:700;min-width:150px;text-align:center}
.edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.edit.week5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.edit.week7{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:start}
.satsun{display:contents}
/* alignement vertical des sections entre les cartes (titre, mode, G1/G2, avertissements, boutons, ordre) */
@supports (grid-template-rows: subgrid){
  .edit.week7 .ed{display:grid;grid-template-rows:subgrid;grid-row:span 6;gap:8px}
  .edit.week7 .ed > *{margin:0}
}
@media (min-width:1100px){
  .edit.week7{grid-template-columns:repeat(6,minmax(0,1fr))}
  .satsun{display:flex;flex-direction:column;gap:10px;grid-row:span 6}
  @supports (grid-template-rows: subgrid){ .satsun .ed{display:flex;flex-direction:column} }
}
@media (max-width:720px){.edit.week5,.edit.week7{grid-template-columns:1fr}}
.ord{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.ord h4{margin:0;font-size:13px;color:var(--muted);font-weight:400}
.edit.week7 .ed{padding:10px}
.edit.week7 .ed h3{font-size:14px}
.edit.week7 .ol li{padding:5px 6px 5px 8px;gap:6px}
.edit.week7 .ol li .ini{font-size:15px}
.edit.week7 .ol li .mv button{width:26px;height:26px}
.edit.week7 .actions .btn{padding:5px 8px;font-size:13px}
.edit.week7 .row{grid-template-columns:46px 1fr}
.edit.week7 .row select{padding:6px 6px}
.edit.week5 .ed{padding:10px}
.edit.week5 .ed h3{font-size:14px}
.edit.week5 .ol li{padding:5px 6px 5px 8px;gap:6px}
.edit.week5 .ol li .ini{font-size:15px}
.edit.week5 .ol li .mv button{width:26px;height:26px}
.edit.week5 .actions .btn{padding:5px 8px;font-size:13px}
.ed{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.ed.fds{background:var(--fds)}
.ed.dirty{border-color:var(--g2)}
.ed h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.ed h3 small{color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}
.row select,.row input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r-sm);padding:7px 8px;width:100%;font-size:15px}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel);align-self:flex-start}
.seg2 button{border:0;background:transparent;padding:4px 12px;border-radius:999px;color:var(--muted);font-size:14px}
.seg2 button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.warn{color:var(--g2-ink);background:var(--g2-soft);border-radius:var(--r-sm);padding:6px 9px;font-size:14px}
.err{color:#fff;background:#b3261e;border-radius:var(--r-sm);padding:6px 9px;font-size:14px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:7px 12px;font-size:15px}
.btn.primary{background:var(--g1);border-color:var(--g1);color:#fff;font-weight:700}
.btn.danger{color:#b3261e;border-color:#b3261e}

.ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ol li{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel)}

.ol li .ini{font-weight:700;flex:1;font-size:16px}
.ol li.garde{background:var(--g1-soft);border-color:var(--g1-soft);color:var(--g1-ink)}

  :root:not([data-theme="light"]) .ol li.abs{background:#4a3f0c;color:#ffe37a;border-color:#a68a00} :root:not([data-theme="light"]) .ol li.abs .ini,:root:not([data-theme="light"]) .ol li.abs .n{color:#ffe37a} }
.ghost{position:fixed;z-index:50;pointer-events:none;display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-radius:var(--r-sm);background:var(--bg);color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.28);border:1px solid var(--g2);font-family:inherit;transform:scale(1.03)}

.hbctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}

<script>
// ---- Couche de données (maquette : seed intégré + modifications sur l'appareil).
// Sera remplacée par Supabase; les écrans n'appellent que Store.*
const SEED = JSON.parse(document.getElementById('data').textContent);
const StoreLocal = {
  load(){ try{ const s=localStorage.getItem('tg.data'); if(s) return JSON.parse(s); }catch(e){} return JSON.parse(JSON.stringify(SEED)); },
  save(){ try{ localStorage.setItem('tg.data', JSON.stringify(D)); }catch(e){} },
  reset(){ try{ localStorage.removeItem('tg.data'); }catch(e){} },
  log(txt){ D.journal=D.journal||[]; D.journal.unshift({t:new Date().toISOString(),par:me?ini(me):'—',txt}); if(D.journal.length>300) D.journal.length=300; this.save(); },
  setGarde(k,g){ if(g) D.gardes[k]=g; else delete D.gardes[k]; this.save(); },
  setChoix(k,c){ if(c) D.choix[k]=c; else delete D.choix[k]; this.save(); },
  saveMembre(m){ const i=D.membres.findIndex(x=>x.id===m.id); if(i<0) D.membres.push(m); else D.membres[i]=m; rebuildM(); this.save(); },
  delMembre(id){ D.membres=D.membres.filter(x=>x.id!==id); rebuildM(); this.save(); },
  setFeries(list){ D.feries=list; FERIES.clear(); list.forEach(x=>FERIES.add(x)); this.save(); },
};
// =====================================================================
// MODE EN LIGNE (Supabase) — remplace la couche locale quand CONFIG est renseignée
// =====================================================================
const ONLINE = !!(window.TG_CONFIG && window.TG_CONFIG.url && window.TG_CONFIG.key);
let sb=null, SNAP={vac:{},ech:{},locks:{},regl:{}}, membreMoi=null;
const uuid=()=> (crypto.randomUUID ? crypto.randomUUID() : 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2));
function erreur(e,ctx){ console.error(ctx,e); toast('Erreur d\'enregistrement ('+ctx+') : '+(e.message||e)); }
function rowsToD(r){
  const mem=r.membres.map(x=>({id:x.id,nom:x.nom,ini:x.ini,courriel:x.courriel||'',mode:x.mode,modeFds:x.mode_fds,venSep:!!x.ven_sep,actif:!!x.actif,responsable:!!x.responsable,ordre:x.ordre}));
  const gardes={}, prov={}; r.gardes.forEach(x=>{ const g={}; ['g1','g1j','g1n','g2'].forEach(k=>{ if(x[k]) g[k]=x[k]; }); gardes[x.jour]=g; if(x.prov) prov[x.jour]=x.prov; });
  const choix={}; r.choix.forEach(x=>{ const c={ordre:x.ordre||[],nuit:x.nuit||null,postGarde:x.post_garde||[],absents:x.absents||[]}; if(x.hb!==null&&x.hb!==undefined) c.hb=x.hb; choix[x.jour]=c; });
  const vacances=r.absences.map(x=>{ const v={id:x.id,membre:x.membre,debut:x.debut,fin:x.fin}; if(x.motif) v.motif=x.motif; if(x.echange) v.echange=x.echange; return v; });
  const feries=r.feries.map(x=>x.jour).sort(); const locks={}; r.verrous.forEach(x=>locks[x.jour]=true);
  const echanges=r.echanges.map(x=>x.data);
  const journal=r.journal.map(x=>({t:x.t,par:x.par||'—',txt:x.txt}));
  const regl={}; r.reglages.forEach(x=>regl[x.cle]=x.valeur);

}
function snapFrom(d){ SNAP={vac:{},ech:{},locks:{...d.locks},regl:{blocs:JSON.stringify(d.blocs),hbDefaut:JSON.stringify(d.reglages.hbDefaut),delaiEncan:JSON.stringify(d.reglages.delaiEncan),capacites:JSON.stringify(d.capacites),lastGen:JSON.stringify(d.lastGen||null)}};

async function chargerTout(){
  const q=async (t,sel,ord)=>{ let qq=sb.from(t).select(sel||'*'); if(ord) qq=qq.order(ord.col,{ascending:ord.asc!==false}); if(t==='journal') qq=qq.limit(300); const {data,error}=await qq; if(error) throw error; return data||[]; };
  const [membres,gardes,choix,absences,feries,verrous,echanges,journal,reglages]=await Promise.all([q('membres'),q('gardes'),q('choix'),q('absences'),q('feries'),q('verrous'),q('echanges'),q('journal','*',{col:'t',asc:false}),q('reglages')]);
  return rowsToD({membres,gardes,choix,absences,feries,verrous,echanges,journal,reglages});
}
function appliquerD(nd){ for(const k of Object.keys(D)) delete D[k]; Object.assign(D,nd); rebuildM(); FERIES.clear(); D.feries.forEach(x=>FERIES.add(x)); snapFrom(D); if(typeof rebuildWho==='function') rebuildWho(); }
const StoreOnline = {

  async save(){ if(!sb) return;

      for(const id in SNAP.vac){ if(!cur[id]) dels.push(id); }

      // échanges
      const eups=[]; const ecur={}; D.echanges.forEach(e=>{ ecur[e.id]=e; const s=JSON.stringify(e); if(SNAP.ech[e.id]!==s) eups.push({id:e.id,type:e.type,statut:e.statut,par:e.par,cible:e.cible||null,preneur:e.preneur||null,data:e,maj:new Date().toISOString()}); });
      if(eups.length){ const {error}=await sb.from('echanges').upsert(eups); if(error) throw error; }
      // verrous
      const ladd=Object.keys(D.locks||{}).filter(k=>!SNAP.locks[k]), ldel=Object.keys(SNAP.locks).filter(k=>!(D.locks||{})[k]);

      if(ldel.length){ const {error}=await sb.from('verrous').delete().in('jour',ldel); if(error) throw error; }
      // réglages
      const regl={blocs:D.blocs,hbDefaut:D.reglages.hbDefaut,delaiEncan:D.reglages.delaiEncan,capacites:D.capacites,lastGen:D.lastGen||null};
      const rups=[]; for(const k in regl){ const s=JSON.stringify(regl[k]); if(SNAP.regl[k]!==s) rups.push({cle:k,valeur:regl[k],maj:new Date().toISOString()}); }
      if(rups.length){ const {error}=await sb.from('reglages').upsert(rups); if(error) throw error; }
      snapFrom(D);
    }catch(e){ erreur(e,'synchronisation'); }
  },
  log(txt){ D.journal=D.journal||[]; const row={t:new Date().toISOString(),par:me?ini(me):'—',txt}; D.journal.unshift(row); if(D.journal.length>300) D.journal.length=300; this.save(); if(sb) sb.from('journal').insert(row).then(({error})=>{ if(error) erreur(error,'journal'); }); },
  setGarde(k,g){ if(g) D.gardes[k]=g; else delete D.gardes[k]; this.save(); if(!sb) return;
    if(g){ sb.from('gardes').upsert({jour:k,g1:g.g1||null,g1j:g.g1j||null,g1n:g.g1n||null,g2:g.g2||null,prov:(D.prov||{})[k]||null,maj:new Date().toISOString(),maj_par:me||null}).then(({error})=>{ if(error) erreur(error,'garde '+k); }); }
    else { if(D.prov) delete D.prov[k]; sb.from('gardes').delete().eq('jour',k).then(({error})=>{ if(error) erreur(error,'garde '+k); }); } },
  setChoix(k,c){ if(c) D.choix[k]=c; else delete D.choix[k]; this.save(); if(!sb) return;
    if(c){ sb.from('choix').upsert({jour:k,ordre:c.ordre,nuit:c.nuit||null,post_garde:c.postGarde||[],absents:c.absents||[],hb:(c.hb===undefined||c.hb===null)?null:c.hb,maj:new Date().toISOString()}).then(({error})=>{ if(error) erreur(error,'ordre '+k); }); }
    else sb.from('choix').delete().eq('jour',k).then(({error})=>{ if(error) erreur(error,'ordre '+k); }); },
  saveMembre(m){ const i=D.membres.findIndex(x=>x.id===m.id); if(i<0) D.membres.push(m); else D.membres[i]=m; rebuildM(); if(!sb) return;
    sb.from('membres').upsert({id:m.id,nom:m.nom,ini:m.ini,courriel:m.courriel||null,mode:m.mode,mode_fds:m.modeFds,ven_sep:!!m.venSep,actif:m.actif!==false,responsable:!!m.responsable,ordre:m.ordre||99,maj:new Date().toISOString()}).then(({error})=>{ if(error) erreur(error,'membre'); }); },
  delMembre(id){ D.membres=D.membres.filter(x=>x.id!==id); rebuildM(); if(sb) sb.from('membres').delete().eq('id',id).then(({error})=>{ if(error) erreur(error,'membre'); }); },
  setFeries(list){ const old=new Set(D.feries); D.feries=list; FERIES.clear(); list.forEach(x=>FERIES.add(x)); if(!sb) return;
    const add=list.filter(x=>!old.has(x)), del=[...old].filter(x=>!list.includes(x));
    if(add.length) sb.from('feries').upsert(add.map(j=>({jour:j}))).then(({error})=>{ if(error) erreur(error,'fériés'); });
    if(del.length) sb.from('feries').delete().in('jour',del).then(({error})=>{ if(error) erreur(error,'fériés'); }); },
};
// ---- écran de connexion
function ecranConnexion(msg, mode){
  let o=document.getElementById('login'); if(!o){ o=document.createElement('div'); o.id='login'; o.className='login'; document.body.appendChild(o); }
  if(mode==='hide'){ o.remove(); return; }
  o.innerHTML=`<div class="lbox"><h1>Tableau de garde <span>Anesthésiologie</span></h1>
    ${mode==='inconnu' ? `<p>Votre compte <b>${msg}</b> n'est pas dans la liste des membres. Demandez à un responsable d'inscrire ce courriel dans votre fiche.</p><button class="btn" id="lOut">Se déconnecter</button>`
    : `<p>Entrez votre courriel; vous recevrez un lien de connexion (aucun mot de passe).</p><input type="email" id="lMail" placeholder="courriel" autocomplete="email"><button class="btn primary" id="lGo">Recevoir le lien</button><div class="meta" id="lMsg">${msg||''}</div>`}</div>`;
  const go=document.getElementById('lGo'); if(go) go.onclick=async()=>{ const email=document.getElementById('lMail').value.trim().toLowerCase(); if(!email) return; go.disabled=true; document.getElementById('lMsg').textContent='Envoi…';
    const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}}); go.disabled=false;
    document.getElementById('lMsg').textContent = error ? ('Erreur : '+error.message) : 'Lien envoyé. Ouvrez le courriel sur cet appareil et cliquez le lien (vérifiez les indésirables).'; };
  const out=document.getElementById('lOut'); if(out) out.onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
}
async function bootOnline(){
  sb=window.supabase.createClient(window.TG_CONFIG.url, window.TG_CONFIG.key);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ ecranConnexion(''); sb.auth.onAuthStateChange((ev,s)=>{ if(s) location.reload(); }); return; }
  let nd; try{ nd=await chargerTout(); }catch(e){ ecranConnexion('Impossible de charger les données : '+(e.message||e)); return; }
  const email=(session.user.email||'').toLowerCase();
  const moi=nd.membres.find(m=>m.actif && (m.courriel||'').toLowerCase()===email);
  if(!moi){ ecranConnexion(email,'inconnu'); return; }
  ecranConnexion('', 'hide');
  appliquerD(nd); membreMoi=moi; me=moi.id; admin=!!moi.responsable;
  // interface : identité fixée, plus de sélecteur ni d'interrupteur
  const whoBox=document.querySelector('.who'); if(whoBox) whoBox.innerHTML=`<span class="moi">${moi.ini} <small>${moi.nom}</small></span><button class="btn sm" id="btnOut" title="Se déconnecter">Quitter</button>`;
  const sw=document.querySelector('.sw'); if(sw) sw.remove();
  document.getElementById('btnOut').onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  const demo=document.getElementById('demo'); if(demo) demo.remove();
  if(view==='gest' && !admin) view='week'; render();
  // temps réel : recharger (avec délai) quand d'autres modifient
  let timer=null; const rechg=()=>{ clearTimeout(timer); timer=setTimeout(async()=>{ if(gen.running) return; try{ const d2=await chargerTout(); const keep={lastGen:D.lastGen}; appliquerD(d2); if(!D.lastGen) D.lastGen=keep.lastGen; render(); }catch(e){ console.error(e); } }, 800); };
  sb.channel('tg').on('postgres_changes',{event:'*',schema:'public'},rechg).subscribe();
  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT') location.reload(); });
}

const Store = ONLINE ? StoreOnline : StoreLocal;
let D = Store.load();
let M; function rebuildM(){ M = Object.fromEntries(D.membres.map(m=>[m.id,m])); }
rebuildM();
const FERIES = new Set(D.feries);
let admin = ONLINE ? false : (localStorage.getItem('tg.admin')==='1');
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const JOURS_C = ['dim','lun','mar','mer','jeu','ven','sam'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const isFds = d => d.getDay()===0 || d.getDay()===5 || d.getDay()===6;
const ini = id => id && M[id] ? M[id].ini : '—';
const nom = id => id && M[id] ? M[id].nom : '';
const enVac = (id,k)=> D.vacances.some(v=>v.membre===id && v.debut<=k && k<=v.fin);
const motifAbs = (id,k)=>{ const v=D.vacances.find(x=>x.membre===id && x.debut<=k && k<=x.fin); return v ? (v.motif||'Vacances') : ''; };
const gardeDe = k => D.gardes[k];
const roleDe = (g,id) => !g||!id?null : g.g1===id?'g1' : g.g1j===id?'g1j' : g.g1n===id?'g1n' : g.g2===id?'g2' : null;

let me = ONLINE ? '' : (localStorage.getItem('tg.me') || '');

let cursor = new Date(TODAY);
let selDay = key(TODAY);
const F={g1:true,g1j:true,g1n:true,g2:true,post:true,vac:true,salle:true,cmp:'lt',pos:6};
const posOK=ps=>F.salle && ps && (F.cmp==='lt'?ps<F.pos:ps>F.pos);
const roleOK=r=>r && F[r];
try{ Object.assign(F, JSON.parse(localStorage.getItem('tg.f')||'{}')); }catch(e){}
const saveF=()=>{ try{localStorage.setItem('tg.f',JSON.stringify(F));}catch(e){} };
const hbDe=c=>(c && c.hb!==undefined && c.hb!==null) ? c.hb : ((D.reglages&&D.reglages.hbDefaut!==undefined)?D.reglages.hbDefaut:1);
const isHB=(i,n,hb)=> i>=n-hb;   // i = index 0-based, n = longueur, hb = nb de HB
const posLabel=(pos,n,hb)=> isHB(pos-1,n,hb===undefined?1:hb) ? 'HB' : (pos===1?'1er':pos+'e');
function posDe(k,id){ const c=D.choix[k]; if(!c||!id) return 0; const i=c.ordre.indexOf(id); return i<0?0:i+1; }
function postDe(k,id){ const c=D.choix[k]; if(c) return c.postGarde.includes(id); const g=D.gardes[addDays(parse(k),-1)&&key(addDays(parse(k),-1))]; return !!(g && (g.g1===id||g.g1n===id)); }

// ---- carte d'un jour
function fmtLong(d){ return JOURS[d.getDay()]+' '+d.getDate()+(d.getDate()===1?'er':'')+' '+MOIS[d.getMonth()]; }
let HL={};
const hlCls=id=>HL[id]?' '+HL[id]:'';
function nameLine(id, cls, note){
  const meCls = id===me?' me':'';
  return `<div class="nm${meCls}${hlCls(id)}">${ini(id)}${note?`<small>${note}</small>`:''}</div>`;
}
function dayCard(k, opts={}){
  const ov=opts.data||{}; const g=(ov.gardes&&k in ov.gardes)?ov.gardes[k]:gardeDe(k); const c=(ov.choix&&k in ov.choix)?ov.choix[k]:D.choix[k];
  const prov=opts.data?{}:((D.prov||{})[k]||{}); const pv=r=>prov[r]?'de '+ini(prov[r]):'';
  const d=parse(k), fds=isFds(d), ferie=FERIES.has(k);
  const cls=['day', fds?'fds':'', k===key(TODAY)?'today':''].join(' ');
  let h=`<article class="${cls}"><header><div class="dn">${opts.long?fmtLong(d):JOURS_C[d.getDay()]+' '+d.getDate()}${ferie?'<small>férié</small>':''}</div>`;
  if(k===key(TODAY)) h+=`<div class="tag">aujourd'hui</div>`;
  h+=`</header><div class="body">`;
  if(!g){ h+=`<div class="empty">Aucune garde attribuée</div></div></article>`; return h; }
  h+=`<div class="role">`;
  if(g.g1){ h+=`<span class="pill g1">G1</span>${nameLine(g.g1,'',pv('g1'))}`; }
  else{
    const renfort = M[g.g1n] && (d.getDay()===5) && M[g.g1n].modeFds==='24h';
    h+=`<span class="pill g1">G1 J</span>${nameLine(g.g1j,'',[renfort?'renfort':'',pv('g1j')].filter(Boolean).join(' · '))}`;
    h+=`<span class="pill g1">G1 N</span>${nameLine(g.g1n,'',pv('g1n'))}`;
  }
  h+=`<span class="pill g2">G2</span>${nameLine(g.g2,'',pv('g2'))}</div>`;
  if(c){
    h+=`<div class="sep"></div><div class="salle"><h4>Ordre de choix de salle</h4><ol>`;
    const blocs=D.blocs; // dernières positions de chaque bloc
    c.ordre.forEach((id,i)=>{
      const pos=i+1; if(pos<=2) return;
      const blk = blocs.slice(0,-1).some(b=>pos===b+1);
      const cl=[id===me?'me':'', pos<=2?'garde':'', blk?'blk':'', c.postGarde.includes(id)?'pg':'', enVacP(id,k,ov)?'abs':''].join(' ');
      const last=isHB(i,c.ordre.length,hbDe(c));
      h+=`<li class="${cl}${last?' hb':''}${hlCls(id)}"><span class="n">${last?'HB':pos}</span><span class="ini">${ini(id)}</span></li>`;
    });
    h+=`</ol></div>`;
    const ret=[];
    const hlIni=id=>HL[id]?`<span class="${HL[id]}">${ini(id)}</span>`:ini(id);
    if(c.nuit) ret.push(`Nuit : <b>${hlIni(c.nuit)}</b>`);
    if(c.postGarde.length) ret.push(`Post-garde : <b>${c.postGarde.map(hlIni).join(', ')}</b>`);
    if(c.absents.length) ret.push(`Absents : ${c.absents.map(id=>hlIni(id)+(motifAbs(id,k)&&motifAbs(id,k)!=='Vacances'?' <small>('+motifAbs(id,k)+')</small>':'')).join(', ')}`);
    const vus=new Set([g.g1,g.g1j,g.g1n,g.g2,c.nuit,...c.ordre,...c.postGarde,...c.absents].filter(Boolean));
    const conge=Object.keys(HL).filter(id=>!vus.has(id)); if(conge.length) ret.push(`Congé : ${conge.map(hlIni).join(', ')}`);
    if(ret.length) h+=`<div class="retrait">${ret.join('<br>')}</div>`;
  } else {
    const vus=new Set([g.g1,g.g1j,g.g1n,g.g2].filter(Boolean)); const hlIni=id=>`<span class="${HL[id]}">${ini(id)}</span>`;
    const conge=Object.keys(HL).filter(id=>!vus.has(id));
    const ret=[]; if(!fds || d.getDay()===5) ret.push(`Pas d'ordre de choix ce jour`); if(conge.length) ret.push(`${conge.map(id=>(enVacP(id,k,ov)?'Vacances':'Congé')+' : '+hlIni(id)).join('<br>')}`);
    if(ret.length) h+=`<div class="retrait">${ret.join('<br>')}</div>`;
  }
  h+=`</div></article>`;
  return h;
}

// ---- semaine
function renderWeek(){
  const mon=monday(cursor);
  const sun=addDays(mon,6);
  document.getElementById('navTitle').textContent =
    (mon.getMonth()===sun.getMonth() ? mon.getDate()+' – '+sun.getDate()+' '+MOIS[mon.getMonth()]
     : mon.getDate()+' '+MOIS[mon.getMonth()].slice(0,4)+'. – '+sun.getDate()+' '+MOIS[sun.getMonth()].slice(0,4)+'.')+' '+sun.getFullYear();
  let h='';
  for(let i=0;i<7;i++) h+=dayCard(key(addDays(mon,i)));
  document.getElementById('week').innerHTML=h;
}

// ---- mois
function renderMonth(){
  const y=cursor.getFullYear(), m=cursor.getMonth();
  document.getElementById('navTitle').textContent=MOIS[m][0].toUpperCase()+MOIS[m].slice(1)+' '+y;
  const first=new Date(y,m,1), start=monday(first);
  let h=JOURS_C.slice(1).concat(JOURS_C[0]).map(j=>`<div class="hd">${j}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i), k=key(d), g=gardeDe(k);
    if(i>=35 && d.getMonth()!==m) break;
    const cls=['cell', d.getMonth()!==m?'out':'', isFds(d)?'fds':'', k===key(TODAY)?'today':'', FERIES.has(k)?'ferie':'', k===selDay?'sel':''];
    let inner=`<span class="num">${d.getDate()}</span>`;
    if(me){
      const r=roleDe(g,me);
      if(r==='g1') cls.push('me-g1');
      else if(r==='g1j'||r==='g1n') cls.push('me-g1','half');
      else if(r==='g2') cls.push('me-g2');
      else if(F.post && postDe(k,me)) cls.push('me-post');
      else if(F.vac && enVac(me,k)) cls.push('me-vac');
      const ps=posDe(k,me); if(posOK(ps)) inner+=`<span class="pos">${posLabel(ps,D.choix[k].ordre.length,hbDe(D.choix[k]))}</span>`;
      if(r) inner+=`<span class="ini"><span class="l">${r==='g1'?'G1 · 24 h':r==='g1j'?'G1 jour':r==='g1n'?'G1 nuit':'G2'}</span></span>`;
      else if(g) inner+=`<span class="ini"><span class="l"><span class="k g1">G1</span>${g.g1?ini(g.g1):ini(g.g1j)+'/'+ini(g.g1n)}</span><span class="l"><span class="k g2">G2</span>${ini(g.g2)}</span></span>`;
    } else if(g){
      inner+=`<span class="ini"><span class="l"><span class="k g1">G1</span>${g.g1?ini(g.g1):ini(g.g1j)+'/'+ini(g.g1n)}</span><span class="l"><span class="k g2">G2</span>${ini(g.g2)}</span></span>`;
    }

    ? `<span><i style="background:var(--g1)"></i>Je suis G1</span><span><i style="background:linear-gradient(135deg,var(--g1) 0 55%,var(--g1-soft) 55% 100%)"></i>G1 jour ou nuit</span><span><i style="background:var(--g2)"></i>Je suis G2</span><span><i style="background:var(--g1-soft)"></i>Lendemain de garde</span><span><i style="background:var(--g2-soft)"></i>Choix de salle ${F.cmp==='lt'?'sous la':'au-delà de la'} ${F.pos}e position</span><span><i style="background:repeating-linear-gradient(135deg,transparent 0 3px,var(--vac) 3px 5px);border:1px solid var(--line)"></i>Mes vacances</span><span><i style="background:var(--g2);width:6px;height:6px;border-radius:50%"></i>Férié</span>`

// ÉCHANGES DE GARDES
// =====================================================================
D.echanges = D.echanges||[]; D.reglages = D.reglages||{delaiEncan:24}; if(D.reglages.hbDefaut===undefined) D.reglages.hbDefaut=1; D.prov = D.prov||{};
const now=()=>new Date();
const ROLE_LBL={g1:'G1 24 h',g1j:'G1 J',g1n:'G1 N',g2:'G2'};
// place d'un membre un jour donné
function placeDe(k,id,data){
  const g=(data&&data.gardes&&k in data.gardes)?data.gardes[k]:D.gardes[k];
  const c=(data&&data.choix&&k in data.choix)?data.choix[k]:D.choix[k];
  const r=roleDe(g,id); if(r) return {kind:r};
  if(c){ const i=c.ordre.indexOf(id); if(i>=0) return {kind:'pos',pos:i+1,last:isHB(i,c.ordre.length,hbDe(c))}; }
  if(enVac(id,k)) return {kind:'vac',motif:motifAbs(id,k)};
  if(c && c.postGarde.includes(id)) return {kind:'post'};
  return {kind:'off'};
}
function placeLbl(pl){ if(!pl) return '—'; if(pl.kind==='pos') return 'Choix '+(pl.last?'HB':pl.pos+(pl.pos===1?'er':'e')); if(pl.kind==='vac') return pl.motif||'Vacances'; if(pl.kind==='post') return 'Post-garde'; if(pl.kind==='off') return 'Congé'; return ROLE_LBL[pl.kind]; }
const slotLbl=s=>{ const d=parse(s.k); return `${JOURS_C[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()].slice(0,4)}. · ${placeLbl(s.pl)}`; };

// vacances en tenant compte d'un patch (permutation vacances ↔ garde)
function enVacP(id,k,P){ let v=enVac(id,k); if(P&&P.vac) P.vac.forEach(x=>{ if(x.k!==k) return; if(x.from===id) v=false; if(x.to===id) v=true; }); return v; }
// permutation des places de A et B le jour k, appliquée sur un patch {gardes,choix,vac}
function swapDay(patch,k,A,B){
  const g0=(k in patch.gardes)?patch.gardes[k]:D.gardes[k]; const c0=(k in patch.choix)?patch.choix[k]:D.choix[k];
  const g=g0?JSON.parse(JSON.stringify(g0)):null; const c=c0?JSON.parse(JSON.stringify(c0)):null;
  const sw=x=>x===A?B:(x===B?A:x);
  if(g){ for(const r of ['g1','g1j','g1n','g2']) if(g[r]) g[r]=sw(g[r]); }
  if(c){
    const ia=c.ordre.indexOf(A), ib=c.ordre.indexOf(B);
    if(ia>=0&&ib>=0){ c.ordre[ia]=B; c.ordre[ib]=A; }
    else if(ia>=0){ c.ordre[ia]=B; } else if(ib>=0){ c.ordre[ib]=A; }
    c.nuit=g?(g.g1n||null):c.nuit;
  }
  // si l'un des deux est en vacances ce jour-là, la place « vacances » change de mains aussi
  patch.vac=patch.vac||[];
  const va=enVacP(A,k,patch), vb=enVacP(B,k,patch);
  if(va!==vb) patch.vac.push({k, from: va?A:B, to: va?B:A});
  if(c) c.absents=actifs().map(m=>m.id).filter(id=>enVacP(id,k,patch) && !(g&&[g.g1,g.g1j,g.g1n,g.g2].includes(id)) && !c.ordre.includes(id));
  patch.gardes[k]=g; patch.choix[k]=c;
  // répercussion sur le lendemain si la nuit change de mains
  const n0=g0?(g0.g1||g0.g1n):null, n1=g?(g.g1||g.g1n):null;
  if(n0!==n1){
    const kn=key(addDays(parse(k),1)); const cn0=(kn in patch.choix)?patch.choix[kn]:D.choix[kn];
    if(cn0){ const cn=JSON.parse(JSON.stringify(cn0));
      cn.postGarde=cn.postGarde.filter(x=>x!==n0); if(n1&&!cn.postGarde.includes(n1)) cn.postGarde.push(n1);
      const gn=(kn in patch.gardes)?patch.gardes[kn]:D.gardes[kn]; const onCall=id=>gn&&[gn.g1,gn.g1j,gn.g1n,gn.g2].includes(id);
      const i1=cn.ordre.indexOf(n1);
      if(i1>=2){ if(n0 && !onCall(n0) && !cn.ordre.includes(n0) && !enVac(n0,kn)) cn.ordre[i1]=n0; else cn.ordre.splice(i1,1); }
      else if(n0 && !onCall(n0) && !cn.ordre.includes(n0) && !enVac(n0,kn)) cn.ordre.push(n0);
      cn.postGarde.sort(); patch.choix[kn]=cn; }
  }
}
// construit le patch complet d'une demande (avec preneur éventuel)
function patchFor(req, preneur){
  const P={gardes:{},choix:{},vac:[]}; const B=preneur||req.cible; if(!B) return P;
  const days=new Set([...req.offre.map(s=>s.k), ...(req.demande||[]).map(s=>s.k)]);
  [...days].sort().forEach(k=>swapDay(P,k,req.par,B));
  return P;
}
function warnsFor(P){ const w=[]; for(const k in P.gardes){ const g=P.gardes[k]; if(!g) continue; const d=parse(k); const ids=[g.g1,g.g1j,g.g1n,g.g2].filter(Boolean);
  if(new Set(ids).size!==ids.length) w.push(`${JOURS_C[d.getDay()]} ${d.getDate()} : une même personne occupe deux rôles.`);
  ids.forEach(id=>{ if(enVacP(id,k,P)) w.push(`${JOURS_C[d.getDay()]} ${d.getDate()} : ${ini(id)} est en vacances.`); });
  const gp=(key(addDays(d,-1)) in P.gardes)?P.gardes[key(addDays(d,-1))]:D.gardes[key(addDays(d,-1))]; if(gp){ [gp.g1,gp.g1n].filter(Boolean).forEach(id=>{ if(ids.includes(id)) w.push(`${JOURS_C[d.getDay()]} ${d.getDate()} : ${ini(id)} est en post-garde.`); }); }
  if(d.getDay()===1){ [g.g1,g.g1n].filter(Boolean).forEach(id=>{ if(enVac(id,key(addDays(d,-1)))) w.push(`${JOURS_C[d.getDay()]} ${d.getDate()} : ${ini(id)} revient de vacances, pas de nuit le lundi.`); }); }
  const gn=(key(addDays(d,1)) in P.gardes)?P.gardes[key(addDays(d,1))]:D.gardes[key(addDays(d,1))]; if(gn){ const nn=[gn.g1,gn.g1j,gn.g1n,gn.g2].filter(Boolean); [g.g1,g.g1n].filter(Boolean).forEach(id=>{ if(nn.includes(id)) w.push(`${JOURS_C[d.getDay()]} ${d.getDate()} : ${ini(id)} fait la nuit et est aussi de garde le lendemain.`); }); }
  } return w; }
function baHtml(P,A,B){ const ks=Object.keys(P.choix).concat(Object.keys(P.gardes)); const days=[...new Set(ks)].sort(); let h='';
  HL={}; if(A) HL[A]='hlA'; if(B) HL[B]='hlB';
  if(A||B) h+=`<div class="hlleg">${A?`<span class="hlA">${ini(A)}</span>`:''}${B?`<span class="hlB">${ini(B)}</span>`:''}</div>`;
  days.forEach(k=>{ h+=`<div class="ba nome"><div><h4>Avant · ${fmtLong(parse(k))}</h4>${dayCard(k,{})}</div><div><h4>Après</h4>${dayCard(k,{data:P})}</div></div>`; });
  HL={};
  const w=warnsFor(P); if(w.length) h+=`<div class="msgs">${w.map(x=>`<div class="warn">${x}</div>`).join('')}</div>`; return h; }
function changesTxt(P){ const out=[]; Object.keys(P.gardes).sort().forEach(k=>{ const a=D.gardes[k]||{}, b=P.gardes[k]||{}; const d=parse(k);
  for(const r of ['g1','g1j','g1n','g2']) if((a[r]||'')!==(b[r]||'')) out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> ${ROLE_LBL[r]} : ${ini(a[r])} → ${ini(b[r])}</li>`); });
  Object.keys(P.choix).sort().forEach(k=>{ const a=(D.choix[k]||{ordre:[]}).ordre, b=(P.choix[k]||{ordre:[]}).ordre; const d=parse(k);
  const hb=hbDe(P.choix[k]||D.choix[k]); b.forEach((id,i)=>{ if(i>=2 && a[i]!==id) out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> position ${isHB(i,b.length,hb)?'HB':i+1} : ${ini(a[i])||'—'} → ${ini(id)}</li>`); }); });
  (P.vac||[]).forEach(x=>{ const d=parse(x.k); out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> vacances : ${ini(x.from)} → ${ini(x.to)}</li>`); });
  return out.length?`<ul class="chg">${out.join('')}</ul>`:'<div class="meta">Aucun changement.</div>'; }

// application définitive
function applyReq(req, preneur){
  const P=patchFor(req,preneur); const A=req.par, B=preneur||req.cible;
  req.avant={gardes:{},choix:{}}; for(const k in P.gardes){ req.avant.gardes[k]=D.gardes[k]||null; } for(const k in P.choix){ req.avant.choix[k]=D.choix[k]||null; }
  for(const k in P.gardes){ const a=D.gardes[k]||{}, b=P.gardes[k]; if(b){ for(const r of ['g1','g1j','g1n','g2']) if(b[r] && a[r]!==b[r]){ D.prov[k]=D.prov[k]||{}; D.prov[k][r]=a[r]||null; } } Store.setGarde(k,b); }
  for(const k in P.choix) Store.setChoix(k,P.choix[k]);
  (P.vac||[]).forEach(x=>{ const out=[]; D.vacances.forEach(v=>{ if(v.membre!==x.from || v.debut>x.k || v.fin<x.k){ out.push(v); return; }
      if(v.debut<x.k) out.push({...v,fin:key(addDays(parse(x.k),-1))}); if(v.fin>x.k) out.push({...v,debut:key(addDays(parse(x.k),1))}); });
    out.push({membre:x.to,debut:x.k,fin:x.k,echange:req.id}); D.vacances=out; });
  req.apres=P; req.preneur=B; req.statut='conclue'; req.concluA=now().toISOString(); Store.save();
  Store.log(`Échange #${req.id} conclu : ${ini(A)} ↔ ${ini(B)} (${req.offre.map(slotLbl).join(', ')})`);
  purgerCaduques();
}

// classement des candidats d'un encan
function derniereAcq(id){ let t=null; D.echanges.forEach(r=>{ if(r.type==='encan'&&r.statut==='conclue'&&r.preneur===id&&(!t||r.concluA>t)) t=r.concluA; }); return t; }
function classer(req){ return [...req.candidats].map(c=>({...c,acq:derniereAcq(c.id)})).sort((a,b)=>{ if(a.acq!==b.acq){ if(!a.acq) return -1; if(!b.acq) return 1; return a.acq<b.acq?-1:1; } return a.t<b.t?-1:1; }); }

// mes créneaux offrables (à partir de demain)
function mesSlots(id, fromK, tout){ const out=[]; let d=parse(fromK||key(addDays(TODAY,1))); const fin=parse(D.periode.fin);
  while(d<=fin){ const k=key(d); const pl=placeDe(k,id); if(tout || (pl.kind!=='off'&&pl.kind!=='vac'&&pl.kind!=='post')) out.push({k,pl}); d=addDays(d,1); } return out; }
const isGardeOuPos=pl=>pl && !['off','vac','post'].includes(pl.kind);
function fdsOf(k){ const d=parse(k); const day=d.getDay(); if(day===5) return k; if(day===6) return key(addDays(d,-1)); if(day===0) return key(addDays(d,-2)); return null; }

let ech={mode:'list', form:null, open:new Set(), hist:false};

const samePl=(a,b)=>a.kind===b.kind && (a.kind!=='pos' || a.pos===b.pos);
function ecartsReq(r){ const e=[]; r.offre.forEach(s=>{ const pl=placeDe(s.k,r.par); if(!samePl(pl,s.pl)) e.push(`${ini(r.par)} ${slotLbl(s)} → maintenant ${placeLbl(pl)}`); });
  (r.demande||[]).forEach(s=>{ const pl=placeDe(s.k,r.cible); if(!samePl(pl,s.pl)) e.push(`${ini(r.cible)} ${slotLbl(s)} → maintenant ${placeLbl(pl)}`); }); return e; }
function purgerCaduques(){ let n=0; D.echanges.forEach(r=>{ if(r.statut!=='ouverte') return; const e=ecartsReq(r); if(e.length){ r.statut='caduque'; r.finA=now().toISOString(); r.raison=e; n++; Store.log(`Échange #${r.id} devenu caduc : ${e.join('; ')}`); } }); if(n) Store.save(); return n; }
// jours déjà engagés dans une demande en cours (par personne) → {k: id de la demande}
function engages(id){ const m={}; D.echanges.forEach(r=>{ if(r.statut!=='ouverte') return; r.offre.forEach(s=>{ if(r.par===id||r.cible===id) m[s.k]=r.id; }); (r.demande||[]).forEach(s=>{ if(r.par===id||r.cible===id) m[s.k]=r.id; }); }); return m; }

function stLbl(r){ if(r.statut==='ouverte') return r.type==='encan'?(r.echeance<now().toISOString()?(r.candidats.length?'À attribuer':'Échéance passée · toujours ouvert'):'Ouvert'):'En attente'; return {conclue:'Conclu',refusee:'Refusé',annulee:'Annulé',caduque:'Caduque'}[r.statut]||r.statut; }

  if(r.type==='encan'&&r.statut==='ouverte'){ const e=new Date(r.echeance); h+=`<div class="meta">Clôture ${r.ecourte?'<b>écourtée</b> (la garde commence le lendemain) ':''}le ${fmtLong(e)} à ${String(e.getHours()).padStart(2,'0')} h${String(e.getMinutes()).padStart(2,'0')}${r.echeance<now().toISOString()?' — <b>échéance passée</b>':''}</div>`;
    const cl=classer(r);
    h+=`<div class="cand">${cl.length?cl.map((c,i)=>`<div class="c${i===0?' reco':''}"><span class="who">${ini(c.id)}</span><span class="why">${i===0?'Recommandé · ':''}${c.acq?'dernière garde reçue à l\'encan le '+fmtLong(new Date(c.acq)):'jamais reçu de garde à l\'encan'} · candidature ${new Date(c.t).getDate()} ${MOIS[new Date(c.t).getMonth()].slice(0,4)}. ${String(new Date(c.t).getHours()).padStart(2,'0')}:${String(new Date(c.t).getMinutes()).padStart(2,'0')}</span>${admin?`<button class="btn sm primary" data-act="attrib" data-id="${r.id}" data-who="${c.id}">Attribuer</button>`:''}</div>`).join(''):'<div class="meta">Aucun candidat pour l\'instant.</div>'}</div>`; }
  if(r.statut==='conclue') h+=`<div class="meta">Conclu le ${fmtLong(new Date(r.concluA))}${r.preneur?' · preneur : <b>'+ini(r.preneur)+'</b>':''}${r.decision&&r.decision.ecart?' · <b>choix du responsable différent de la recommandation ('+ini(r.decision.reco)+')</b>':''}</div>`;
  if(r.statut==='refusee'||r.statut==='annulee') h+=`<div class="meta">${r.statut==='refusee'?'Refusé':'Annulé'} par ${ini(r.finPar)} le ${fmtLong(new Date(r.finA))}</div>`;
  if(r.statut==='caduque') h+=`<div class="warn">Devenue caduque le ${fmtLong(new Date(r.finA))} : le tableau a changé depuis la demande.<br>${(r.raison||[]).join('<br>')}</div>`;
  // actions
  const acts=[];
  if(r.statut==='ouverte'){
    if(r.type==='direct'&&r.cible===me){ acts.push(`<button class="btn primary" data-act="accept" data-id="${r.id}">Accepter</button><button class="btn" data-act="refuse" data-id="${r.id}">Refuser</button>`); }
    if(r.type==='encan'&&me&&r.par!==me){ acts.push(r.candidats.some(c=>c.id===me)?`<button class="btn" data-act="retirer" data-id="${r.id}">Retirer ma candidature</button>`:`<button class="btn primary" data-act="appliquer" data-id="${r.id}">Appliquer</button>`); }
    if(r.par===me||admin) acts.push(`<button class="btn" data-act="annuler" data-id="${r.id}">Annuler la demande</button>`);
  }
  acts.push(`<button class="btn" data-act="toggle" data-id="${r.id}">${open?'Masquer':'Voir'} l'effet sur le tableau</button>`);
  h+=`<div class="actions">${acts.join('')}</div>`;
  if(open){
    if(r.statut==='conclue') h+=`<div class="meta">Changements appliqués :</div>${changesFromSnap(r)}${baFromSnap(r)}`;
    else if(r.type!=='encan'){ const P=patchFor(r); h+=`<div class="meta">Effet sur le tableau :</div>${changesTxt(P)}${baHtml(P,r.par,r.cible)}`; }
    else {
      let shown=false;
      if(me && me!==r.par){ const P=patchFor(r,me); const w=warnsFor(P); h+=`<div class="meta"><b>Si je prends cette garde (${ini(me)})</b>${w.length?' — <span style="color:var(--g2-ink)">'+w.length+' avertissement'+(w.length>1?'s':'')+'</span>':' — aucun conflit'} :</div>${changesTxt(P)}${baHtml(P,r.par,me)}`; shown=true; }
      if(admin && r.candidats.length){ const c=classer(r)[0].id; if(c!==me){ const P=patchFor(r,c); h+=`<div class="meta" style="margin-top:10px"><b>Si la garde va au candidat recommandé (${ini(c)})</b> :</div>${changesTxt(P)}${baHtml(P,r.par,c)}`; shown=true; } }
      if(!shown) h+=`<div class="meta">${me?'':'Choisissez votre nom dans « Je suis » pour voir l\'effet si vous preniez cette garde.'}${r.candidats.length?'':' L\'effet pour le responsable sera visible dès qu\'il y aura un candidat.'}</div>`;
    } }
  return h+`</div>`;
}
function baFromSnap(r){ if(!r.avant||!r.apres) return ''; const days=[...new Set(Object.keys(r.apres.gardes).concat(Object.keys(r.apres.choix)))].sort();
  const A=r.par, B=r.preneur||r.cible; HL={}; if(A) HL[A]='hlA'; if(B) HL[B]='hlB'; let h=`<div class="hlleg">${A?`<span class="hlA">${ini(A)}</span>`:''}${B?`<span class="hlB">${ini(B)}</span>`:''}</div>`;
  const av={gardes:r.avant.gardes,choix:r.avant.choix,vac:(r.apres.vac||[]).map(x=>({k:x.k,from:x.to,to:x.from}))}, ap={gardes:r.apres.gardes,choix:r.apres.choix,vac:r.apres.vac||[]};
  days.forEach(k=>{ h+=`<div class="ba nome"><div><h4>Avant · ${fmtLong(parse(k))}</h4>${dayCard(k,{data:av})}</div><div><h4>Après</h4>${dayCard(k,{data:ap})}</div></div>`; }); HL={}; return h; }
function changesFromSnap(r){ if(!r.avant||!r.apres) return ''; const out=[];
  Object.keys(r.apres.gardes).sort().forEach(k=>{ const a=r.avant.gardes[k]||{}, b=r.apres.gardes[k]||{}; const d=parse(k); for(const x of ['g1','g1j','g1n','g2']) if((a[x]||'')!==(b[x]||'')) out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> ${ROLE_LBL[x]} : ${ini(a[x])} → ${ini(b[x])}</li>`); });
  Object.keys(r.apres.choix).sort().forEach(k=>{ const a=(r.avant.choix[k]||{ordre:[]}).ordre, b=(r.apres.choix[k]||{ordre:[]}).ordre; const d=parse(k); const hb=hbDe(r.apres.choix[k]); b.forEach((id,i)=>{ if(i>=2&&a[i]!==id) out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> position ${isHB(i,b.length,hb)?'HB':i+1} : ${ini(a[i])||'—'} → ${ini(id)}</li>`); }); });
  (r.apres.vac||[]).forEach(x=>{ const d=parse(x.k); out.push(`<li><span class="dayk">${JOURS_C[d.getDay()]} ${d.getDate()}</span> vacances : ${ini(x.from)} → ${ini(x.to)}</li>`); });
  return out.length?`<ul class="chg">${out.join('')}</ul>`:'<div class="meta">Aucun changement enregistré.</div>'; }

function actReq(a,id,who){
  const r=D.echanges.find(x=>x.id===id); if(!r) return;
  if(r.statut==='ouverte' && a!=='toggle' && a!=='annuler' && ecartsReq(r).length){ purgerCaduques(); toast('Cette demande est devenue caduque : le tableau a changé.'); return renderEch(); }
  const fin=(st)=>{ r.statut=st; r.finPar=me; r.finA=now().toISOString(); Store.save(); };
  if(a==='toggle'){ ech.open.has(id)?ech.open.delete(id):ech.open.add(id); return renderEch(); }
  if(a==='accept'){ const P=patchFor(r); const w=warnsFor(P); confirmBox(`Accepter cet échange?${w.length?'<br><br>Avertissements :<br>'+w.join('<br>'):''}`,()=>{ applyReq(r); toast('Échange conclu'); renderEch(); }); return; }
  if(a==='refuse'){ confirmBox('Refuser cette demande?',()=>{ fin('refusee'); Store.log(`Échange #${id} refusé par ${ini(me)}`); renderEch(); }); return; }
  if(a==='annuler'){ confirmBox('Annuler cette demande?',()=>{ fin('annulee'); Store.log(`Échange #${id} annulé par ${ini(me)}`); renderEch(); }); return; }
  if(a==='appliquer'){ r.candidats.push({id:me,t:now().toISOString()}); Store.save(); Store.log(`Encan #${id} : candidature de ${ini(me)}`); toast('Candidature enregistrée'); return renderEch(); }
  if(a==='retirer'){ r.candidats=r.candidats.filter(c=>c.id!==me); Store.save(); Store.log(`Encan #${id} : ${ini(me)} retire sa candidature`); return renderEch(); }
  if(a==='attrib'){ const reco=classer(r)[0].id; const P=patchFor(r,who); const w=warnsFor(P);
    confirmBox(`Attribuer la garde à <b>${ini(who)}</b>?${who!==reco?'<br><br>Le candidat recommandé est '+ini(reco)+'; votre choix sera signalé.':''}${w.length?'<br><br>Avertissements :<br>'+w.join('<br>'):''}`,()=>{ r.decision={par:me,t:now().toISOString(),reco,ecart:who!==reco}; applyReq(r,who); toast('Garde attribuée'); renderEch(); }); return; }
}

function slotShort(s){ const d=parse(s.k); return `${JOURS_C[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()].slice(0,4)}. · ${placeLbl(s.pl)}`; }

  L_body+=`<div class="actions" style="justify-content:flex-start">${canSplit?`<button class="btn sm" id="nSplit">Fractionner ma G1 24 h en J + N</button>`:''}</div>`;

      R_lbl=`<div class="step"><label>4. Ce que je demande en retour <span class="badge" style="background:var(--ink)">${f.dem.size}</span></label></div>`;
      R_tog=`<div class="seg2"><button data-p2="liste" aria-pressed="${f.pick2==='liste'}">Ses gardes</button><button data-p2="cal" aria-pressed="${f.pick2==='cal'}">Calendrier</button></div>`;
      if(f.pick2==='liste'){ const bz2=engages(f.cible); R_body+=`<div class="slotlist" id="nDem">${th.filter(s=>s.pl.kind!=='pos').map(s=>{ const d=parse(s.k); const b=bz2[s.k]; return `<label class="${f.dem.has(s.k)?'on':''}${b?' busy':''}"><input type="checkbox" data-k="${s.k}" ${f.dem.has(s.k)?'checked':''} ${b?'disabled':''}><span class="dt">${JOURS_C[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()].slice(0,4)}.</span><span>${placeLbl(s.pl)}</span><span class="fdsg">${b?'demande #'+b+' en cours':(f.sel.has(s.k)?'même jour':'')}</span></label>`; }).join('')||'<div class="meta">Aucune garde à venir.</div>'}</div>`; }
      else R_body+=calHtml(f.cible,thAll,f.dem,f.cal2,'cal2',f.sel);
      if(f.dem.size) R_body+=`<div class="chips">${[...f.dem].sort().map(k=>`<span class="chip">${slotShort({k,pl:placeDe(k,f.cible)})}<button data-rm2="${k}" title="Retirer">×</button></span>`).join('')}</div>`;
    } else { R_lbl=`<div class="step ph"><label>4. Ce que je demande en retour</label></div>`; R_body=`<div class="phbox ph">${f.type==='direct'?'Choisissez avec qui, ci-dessus.':(f.type==='don'?'Aucune contrepartie pour un don.':'Aucune contrepartie pour un encan.')}</div>`; }
    // --- bas : répartition, note, aperçu, envoi

  const sp=document.getElementById('nSplit'); if(sp) sp.onclick=()=>{ [...f.sel].forEach(k=>{ const g=D.gardes[k]; if(g&&g.g1===me){ const ng={g1j:me,g1n:me,g2:g.g2}; Store.setGarde(k,ng); if(D.choix[k]) Store.setChoix(k,{...D.choix[k],nuit:me}); Store.log(`Garde ${k} fractionnée en J + N par ${ini(me)}`); } }); toast('Garde fractionnée : offrez J ou N séparément'); renderEch(); };
  document.getElementById('nCancel').onclick=()=>{ ech.mode='list'; renderEch(); };

}
// lots : séparément = un lot par jour ; un seul lot = tout ou rien ; échange = toujours un seul lot
function lotsDe(f){
  const ks=[...f.sel].sort();
  if(f.type==='direct' || f.lot==='un') return ks.length?[ks]:[];
  return ks.map(k=>[k]);
}
function draftReqs(){ const f=ech.form; return lotsDe(f).map((ks,i)=>draftReq(ks, D.echanges.length+1+i)); }
function draftReq(ks, num){ const f=ech.form; const id=String(num||D.echanges.length+1).padStart(3,'0');
  const offre=(ks||[...f.sel].sort()).map(k=>({k,pl:placeDe(k,me)})); const demande=[...f.dem].sort().map(k=>({k,pl:placeDe(k,f.cible)}));

// --- résumé de 18 h (simulation du courriel)
function mailTxt(since, until, titre){
  const nouv=D.echanges.filter(r=>r.creeA>since&&r.creeA<=until), conc=D.echanges.filter(r=>r.statut==='conclue'&&r.concluA>since&&r.concluA<=until), ref=D.echanges.filter(r=>['refusee','annulee','caduque'].includes(r.statut)&&r.finA>since&&r.finA<=until), bientot=D.echanges.filter(r=>r.type==='encan'&&r.statut==='ouverte'&&r.echeance<new Date(new Date(until).getTime()+24*3600e3).toISOString());
  const esc=s=>String(s).replace(/</g,'&lt;');
  const li=r=>{ const t=esc(`  • #${r.id} ${r.type==='encan'?'Encan':(r.demande&&r.demande.length?'Échange':'Don')} — ${ini(r.par)}${r.cible?' → '+ini(r.cible):''}${r.preneur?' → '+ini(r.preneur):''} : ${r.offre.map(slotLbl).join(', ')}`); return r.statut==='caduque'?`  <s>${t.trim()}</s> (caduque)`:t; };
  return `Objet : Tableau de garde — ${titre}

Nouvelles demandes (${nouv.length})
${nouv.map(li).join('\n')||'  —'}

Demandes conclues (${conc.length})
${conc.map(li).join('\n')||'  —'}

Demandes refusées, annulées ou caduques (${ref.length})
${ref.map(li).join('\n')||'  —'}

Encans qui se terminent d'ici 24 h (${bientot.length})
${bientot.map(r=>li(r)+' — clôture '+fmtLong(new Date(r.echeance))).join('\n')||'  —'}

Consultez la page Échanges pour les détails et l'effet de chaque demande sur le tableau.`;
}
function renderMail(box){
  const t=now(); const cut=new Date(t.getFullYear(),t.getMonth(),t.getDate(),18,0,0); if(t<cut) cut.setDate(cut.getDate()-1); const prev=new Date(cut.getTime()-24*3600e3); const next=new Date(cut.getTime()+24*3600e3);
  const hm=d=>`${String(d.getHours()).padStart(2,'0')} h ${String(d.getMinutes()).padStart(2,'0')}`;
  const aVenir=mailTxt(cut.toISOString(), t.toISOString(), `résumé des échanges (envoi prévu le ${fmtLong(next)} 18 h)`);
  const dernier=mailTxt(prev.toISOString(), cut.toISOString(), `résumé des échanges du ${fmtLong(prev)} 18 h au ${fmtLong(cut)} 18 h`);

    <div class="meta">Le courriel part automatiquement chaque jour à 18 h à tout le groupe (simulation dans la maquette).</div></div>`;

// validations d'un jour de garde (avertissements, pas des blocages)
function checkGarde(k,g){
  const w=[], ids=[g.g1,g.g1j,g.g1n,g.g2].filter(Boolean);
  if(new Set(ids).size!==ids.length) w.push('Une même personne occupe deux rôles.');
  ids.forEach(id=>{ if(enVac(id,k)) w.push(ini(id)+' est en vacances ce jour-là.'); });
  nightBefore(k).forEach(id=>{ if(ids.includes(id)) w.push(ini(id)+' est en post-garde (nuit la veille).'); });
  const d=parse(k);
  if(d.getDay()===1){ [g.g1,g.g1n].filter(Boolean).forEach(id=>{ if(enVac(id,key(addDays(d,-1)))) w.push(ini(id)+' revient de vacances : pas de nuit le lundi.'); }); }
  const next=D.gardes[key(addDays(d,1))]; if(next){ const nn=[next.g1,next.g1j,next.g1n,next.g2].filter(Boolean); [g.g1,g.g1n].filter(Boolean).forEach(id=>{ if(nn.includes(id)) w.push(ini(id)+' fait la nuit et travaille aussi le lendemain.'); }); }
  return w;
}
function ordreDefaut(k){
  const g=D.gardes[k]; if(!g) return null;
  const post=nightBefore(k), top=[g.g1||g.g1j, g.g2];
  const prev=(()=>{ let d=addDays(parse(k),-1); for(let i=0;i<7;i++,d=addDays(d,-1)){ const c=D.choix[key(d)]; if(c) return c.ordre.slice(2); } return []; })();
  let rest=[...prev.filter(id=>M[id]&&M[id].actif), ...actifs().map(m=>m.id).filter(id=>!prev.includes(id))];
  if(prev.length>=3) rest=[...rest.slice(3),...rest.slice(0,3)]; // rotation simple : les 3 premiers d'hier passent en fin
  rest=rest.filter(id=>!top.includes(id) && id!==g.g1n && !post.includes(id) && !enVac(id,k));
  return {ordre:[...top,...rest], nuit:g.g1n||null, postGarde:post, absents:actifs().map(m=>m.id).filter(id=>enVac(id,k))};
}

  let h=`<div class="ord"><h4>Ordre de choix de salle</h4>`;

  else if(!c) h+=`<div class="hors">Aucun ordre défini.</div><div class="actions"><button class="btn sm primary" data-o="auto">Créer l'ordre par défaut</button></div>`;
  else {
    const b=D.blocs;
    const post=nightBefore(k);
    h+=`<ol class="ol" data-hb="${hbDe(c)}">`+c.ordre.slice(2).map((id,j)=>{ const i=j+2, pos=i+1, blk=b.slice(0,-1).some(x=>pos===x+1);

      const title = flag===' pg' ? ' title="Post-garde (nuit la veille)"' : flag===' abs' ? ' title="Absent (vacances)"' : '';

      return `<li data-id="${id}" class="drag${blk?' blk':''}${flag}${last?' hb':''}"${title||(last?' title="Hors bloc"':'')}><span class="n">${last?'HB':pos}</span><span class="ini">${ini(id)}</span><span class="mv"><button data-o="rm" data-i="${i}" title="Retirer de l'ordre">×</button></span></li>`; }).join('')+`</ol>`;
    const hors=actifs().map(m=>m.id).filter(id=>!c.ordre.includes(id));
    h+=`<div class="hors">${c.nuit?`Nuit : <b>${ini(c.nuit)}</b> · `:''}${c.postGarde.length?`Post-garde : <b>${c.postGarde.map(ini).join(', ')}</b> · `:''}${c.absents.length?`Absents : ${c.absents.map(ini).join(', ')}`:''}
      ${hors.length?`<div style="margin-top:6px">Ajouter : <select data-o="addsel"><option value="">—</option>${hors.map(id=>`<option value="${id}">${ini(id)}</option>`).join('')}</select></div>`:''}</div>
      <div class="hbctl"><span>Hors bloc (HB)</span><button class="btn sm" data-o="hbm" ${hbDe(c)<=0?'disabled':''}>−</button><b>${hbDe(c)}</b><button class="btn sm" data-o="hbp" ${hbDe(c)>=Math.max(0,c.ordre.length-2)?'disabled':''}>+</button>${c.hb!==undefined&&c.hb!==null&&c.hb!==D.reglages.hbDefaut?`<button class="btn sm" data-o="hbd" title="Revenir à la valeur par défaut (${D.reglages.hbDefaut})">↺</button>`:''}</div>
      <div class="actions"><button class="btn sm" data-o="auto">Recalculer</button><button class="btn sm" data-o="clear">Effacer l'ordre</button></div>`;
  }
  return h+`</div>`;
}
function bindOrdre(ed,k){
  const setC=(c,txt)=>{ Store.setChoix(k,c); Store.log(`Ordre de choix ${k} : ${txt}`); renderGest(); };
  ed.querySelectorAll('button[data-o]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.o, c=D.choix[k]?JSON.parse(JSON.stringify(D.choix[k])):null, i=+b.dataset.i;
    if(a==='auto'){ const o=ordreDefaut(k); if(c&&c.hb!==undefined) o.hb=c.hb; return setC(o,'ordre par défaut'); }
    if(a==='clear') return confirmBox(`Effacer l'ordre de choix du ${fmtLong(parse(k))}?`,()=>{ Store.setChoix(k,null); Store.log(`Ordre de choix ${k} effacé`); renderGest(); });
    if(a==='rm'){ const id=c.ordre.splice(i,1)[0]; return setC(c,`${ini(id)} retiré`); }

// glisser-déposer (souris et tactile) dans une liste .ol ; les 2 premières positions restent fixes
function bindDrag(ol, onDone){
  const renum=()=>{ const n=ol.children.length; const hb=+(ol.dataset.hb||1); [...ol.children].forEach((x,i)=>{ const pos=i+3, b=D.blocs, last=isHB(i,n,hb); x.querySelector('.n').textContent=last?'HB':pos; x.classList.toggle('blk', b.slice(0,-1).some(v=>pos===v+1)); x.classList.toggle('hb',last); }); };
  ol.querySelectorAll('li.drag').forEach(hd=>{
    hd.addEventListener('pointerdown', e=>{
      if(e.button!==undefined && e.button!==0) return;
      if(e.target.closest('button')) return;
      e.preventDefault();
      const li=hd; const r0=li.getBoundingClientRect();
      const ghost=li.cloneNode(true); ghost.className='ghost'; ghost.style.width=r0.width+'px'; ghost.style.left=r0.left+'px'; ghost.style.top=r0.top+'px'; document.body.appendChild(ghost);
      const dy=e.clientY-r0.top, dx=e.clientX-r0.left; li.classList.add('lift');
      const move=ev=>{ ev.preventDefault(); ghost.style.top=(ev.clientY-dy)+'px'; ghost.style.left=(ev.clientX-dx)+'px';
        const y=ev.clientY; const others=[...ol.querySelectorAll('li.drag')].filter(x=>x!==li);
        let target=null; for(const o of others){ const r=o.getBoundingClientRect(); if(y < r.top + r.height/2){ target=o; break; } }
        const cur=li.nextSibling;
        if(target){ if(cur!==target){ ol.insertBefore(li,target); renum(); } }
        else if(ol.lastElementChild!==li){ ol.appendChild(li); renum(); } };
      const up=()=>{ document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up); ghost.remove(); li.classList.remove('lift'); onDone([...ol.children].map(x=>x.dataset.id)); };
      document.addEventListener('pointermove',move,{passive:false}); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
    });
  });
}
